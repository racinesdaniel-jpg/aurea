/* ---- Contexto de cada filosofía o disciplina (se muestra al terminar la cápsula) ---- */
var TRAD={
 estoicismo:{n:'El Estoicismo',t:'Escuela filosófica nacida en Atenas hacia el año 300 a. C. con Zenón de Citio, que se reunía bajo un pórtico pintado («stoa», de ahí su nombre). Sus grandes maestros romanos fueron Séneca, consejero de Nerón; Epicteto, un esclavo que llegó a ser maestro; y Marco Aurelio, emperador de Roma. Enseñaban que la felicidad no depende de lo que nos pasa, sino de cómo respondemos, y que las cuatro virtudes que vale la pena cultivar son la sabiduría, la justicia, la valentía y la templanza.'},
 budismo:{n:'El Budismo',t:'Tradición que nace en el norte de la India hacia el siglo V a. C. con Siddhartha Gautama, un príncipe que dejó su palacio para entender por qué sufrimos. Tras años de búsqueda alcanzó el «despertar» y pasó a ser conocido como Buda, «el que despertó». Más que una religión con dioses, es un método práctico para observar la mente, soltar lo que nos ata y vivir con compasión. Hoy lo practican más de 500 millones de personas, y la ciencia estudia muchas de sus técnicas, como la meditación.'},
 taoismo:{n:'El Taoísmo',t:'Filosofía china atribuida a Lao Tse, sabio que según la tradición vivió hacia el siglo VI a. C. y escribió el Tao Te Ching, un libro breve de 81 poemas. El «Tao» es el camino o el orden natural de las cosas: el ritmo con el que crecen las plantas, corren los ríos y cambian las estaciones. El Taoísmo propone vivir en armonía con ese orden, con sencillez y suavidad, en lugar de imponerle nuestra fuerza.'},
 hermetismo:{n:'El Hermetismo',t:'Corriente de pensamiento que surge en el Egipto helenístico, en los primeros siglos de nuestra era, y se atribuye a la figura legendaria de Hermes Trismegisto, «el tres veces grande». Influyó en la alquimia, en el Renacimiento y en muchas escuelas espirituales modernas. En 1908 se publicó El Kybalión, que resume sus enseñanzas en siete principios: mentalismo, correspondencia, vibración, polaridad, ritmo, causa y efecto, y género.'},
 contemplativas:{n:'Las tradiciones contemplativas',t:'Así se llama al conjunto de prácticas de introspección que comparten muchas culturas: la meditación budista, la oración silenciosa cristiana, el yoga de la India o la contemplación sufí. Aunque nacieron en lugares distintos, coinciden en algo: entrenar la atención y el corazón cambia la forma en que vivimos. Hoy la psicología y la neurociencia investigan sus efectos sobre el estrés, las emociones y la salud.'},
 psicologia:{n:'La psicología moderna',t:'La psicología estudia cómo pensamos, sentimos y actuamos. En el siglo XX, investigadores como Aaron Beck y Albert Ellis demostraron que muchas emociones dolorosas nacen de pensamientos automáticos que podemos aprender a reconocer y cambiar: es la base de la terapia cognitiva, una de las más estudiadas del mundo. Curiosamente, ambos reconocieron que esta idea ya estaba en los estoicos.'},
 emocional:{n:'La inteligencia emocional',t:'Concepto propuesto por los psicólogos Peter Salovey y John Mayer en 1990 y popularizado por Daniel Goleman en 1995. Describe la capacidad de reconocer y manejar nuestras emociones y las de los demás. Sus cinco pilares son el autoconocimiento, la autorregulación, la motivación, la empatía y las habilidades sociales. Según Goleman, pesa tanto como el coeficiente intelectual en el éxito personal y profesional.'},
 dinero:{n:'La psicología del dinero',t:'Disciplina que une la economía y la psicología para entender por qué tomamos las decisiones financieras que tomamos. Sus investigaciones muestran que no manejamos el dinero solo con números: lo hacemos con emociones, miedos y creencias aprendidas en la infancia. Por eso dos personas con el mismo ingreso pueden tener vidas económicas muy distintas.'},
 finanzas:{n:'Las finanzas personales',t:'Es el arte de administrar el dinero de una persona o una familia: ganar, gastar, ahorrar, invertir y protegerse ante imprevistos. Sus principios son sencillos y se han repetido durante siglos, desde las tablillas de Babilonia hasta los planificadores actuales. Lo difícil no es entenderlos, sino aplicarlos con constancia.'},
 inversion:{n:'Los principios de inversión',t:'Invertir es poner el dinero a trabajar para que crezca con el tiempo. La teoría moderna de inversión nace en 1952 con Harry Markowitz, que ganó el Premio Nobel por demostrar matemáticamente que repartir el dinero entre distintos activos reduce el riesgo sin sacrificar tanto la ganancia. Sus tres aliados son el tiempo, la constancia y la diversificación.'},
 exito:{n:'La filosofía del éxito',t:'Corriente de pensamiento, sobre todo estadounidense, que estudia qué hace prosperar a las personas. Nace en el siglo XIX con ensayistas como Ralph Waldo Emerson y continúa con autores como Napoleon Hill o Stephen Covey. Sostiene que el éxito duradero depende más del carácter, el servicio y los hábitos que de la suerte.'},
 habitos:{n:'La ciencia de los hábitos',t:'Rama de la psicología del comportamiento que estudia cómo se forman y se cambian las rutinas. Investigadores como BJ Fogg, de la Universidad de Stanford, y divulgadores como James Clear mostraron que un hábito tiene tres partes: una señal, una acción y una recompensa. Su gran lección: los cambios grandes se construyen con acciones pequeñas repetidas a diario.'},
 crecimiento:{n:'La psicología del crecimiento',t:'Campo de investigación encabezado por Carol Dweck, profesora de la Universidad de Stanford. Tras décadas de estudios descubrió que las personas que creen que sus capacidades pueden desarrollarse («mentalidad de crecimiento») aprenden más y se recuperan mejor de los fracasos que quienes creen que su talento es fijo.'},
 profesional:{n:'El desarrollo profesional',t:'Estudia cómo las personas crecen en su trabajo y aumentan su valor a lo largo de la vida. Se apoya en la teoría del capital humano del economista Gary Becker, Premio Nobel en 1992, que demostró que la educación y las habilidades son una inversión con retorno, igual que una máquina o un terreno.'},
 estilo:{n:'La medicina del estilo de vida',t:'Especialidad médica que usa los hábitos diarios como tratamiento: alimentación, actividad física, sueño, manejo del estrés, relaciones sanas y evitar sustancias dañinas. Está respaldada por colegios médicos de Estados Unidos y Europa, y la Organización Mundial de la Salud estima que la mayoría de las enfermedades crónicas pueden prevenirse con estos seis pilares.'},
 nutricion:{n:'La ciencia de la nutrición',t:'Estudia cómo los alimentos afectan nuestro cuerpo y nuestra salud. En las últimas décadas ha pasado de contar calorías a mirar la calidad de lo que comemos: cuánto procesamiento tiene, cuánta fibra aporta y cómo influye en nuestra energía, nuestro ánimo y nuestro intestino.'},
 sueno:{n:'La medicina del sueño',t:'Especialidad que estudia qué ocurre mientras dormimos y cómo dormir mejor. Hoy sabemos que el sueño no es tiempo perdido: es cuando el cerebro ordena la memoria, el cuerpo se repara y se regulan el hambre y el ánimo. Su base es el ritmo circadiano, el reloj interno de unas 24 horas que se sincroniza con la luz.'},
 ejercicio:{n:'La medicina del ejercicio',t:'Estudia el movimiento como herramienta de salud. Sus investigaciones muestran que el ejercicio regular reduce el riesgo de enfermedades del corazón, diabetes, depresión y deterioro cognitivo, y que nunca es tarde para empezar: los beneficios aparecen a cualquier edad.'},
 atencion:{n:'La atención plena',t:'Conocida en inglés como «mindfulness», es la práctica de prestar atención al momento presente, con curiosidad y sin juzgar. Nace de la meditación budista y llegó a la medicina en 1979, cuando Jon Kabat-Zinn creó en la Universidad de Massachusetts un programa para reducir el estrés que hoy se usa en hospitales de todo el mundo.'}
};
/* Para cada cápsula: tradiciones, la idea explicada, una frase de su origen y un libro para profundizar */
var LEARN={
 s1:{tr:['estoicismo'],idea:'Epicteto enseñaba que hay cosas que dependen de nosotros (lo que pensamos, decidimos y hacemos) y cosas que no (lo que otros piensan, la economía, el clima, el pasado). Gran parte de nuestra angustia viene de querer controlar lo segundo. Los estoicos proponen poner toda la energía en lo primero y aceptar con serenidad lo demás.',q:'De todas las cosas, unas dependen de nosotros y otras no.',qa:'Epicteto, Enquiridión',bk:'Enquiridión (Manual de vida), de Epicteto'},
 s2:{tr:['budismo'],idea:'Fue la primera enseñanza de Buda. Primera verdad: en la vida hay dolor e insatisfacción. Segunda: su causa es el deseo de que las cosas sean distintas a como son. Tercera: ese sufrimiento puede terminar. Cuarta: hay un camino práctico para lograrlo, el Óctuple Sendero. Funciona como un diagnóstico médico: síntoma, causa, pronóstico y tratamiento.',q:'Lo que enseño es el sufrimiento y el fin del sufrimiento.',qa:'Atribuido a Buda',bk:'El corazón de las enseñanzas de Buda, de Thich Nhat Hanh'},
 s3:{tr:['budismo','psicologia'],idea:'La necesidad de aprobación tiene dos explicaciones que se complementan.',by:{budismo:'Buda enseñó anattā, el «no-yo»: lo que llamamos «yo» no es algo fijo, sino una suma de pensamientos, recuerdos y etiquetas que cambian. Cuando nos identificamos con esa imagen (soy exitoso, soy buena persona, soy inteligente), cualquier crítica se siente como un ataque y vivimos defendiéndola. La práctica budista propone observar al ego con curiosidad, sin obedecerle.',psicologia:'La psicología moderna llama a esto autoestima contingente: un valor personal que depende de la aprobación de los demás. Los estudios muestran que es frágil, sube y baja con cada comentario y genera ansiedad. Lo sano es una autoestima basada en tus valores y tu esfuerzo, no en la opinión ajena.'},q:'Si quieres progresar, conténtate con parecer ignorante en cosas externas.',qa:'Epicteto',bk:'El ego es el enemigo, de Ryan Holiday'},
 s4:{tr:['budismo','estoicismo'],idea:'Dos tradiciones nacidas a miles de kilómetros de distancia, sin contacto entre ellas, llegaron a la misma conclusión: nada permanece igual.',by:{budismo:'Anicca, la impermanencia, es una de las tres marcas de la existencia que enseñó Buda: todo lo que nace cambia y termina, incluidas nuestras emociones, posesiones y relaciones. El sufrimiento aparece cuando nos aferramos a algo como si fuera a durar para siempre. La meditación budista invita a observar cómo cada pensamiento y cada sensación surgen y se van.',estoicismo:'Para los estoicos, el universo es un flujo constante de cambio guiado por la razón, a la que llamaban logos. Marco Aurelio escribe en sus Meditaciones que todo se transforma y que el tiempo es como un río que arrastra cada cosa apenas aparece; por eso aconsejaba disfrutar lo que tenemos como algo prestado, y recordar que el elogio y la ofensa pronto serán olvidados. Epicteto lo llevaba a la vida diaria: al despedirte de alguien que amas, recuerda que es mortal, y lo valorarás más.'},end:'Entenderlo trae alivio: el mal momento también pasará, y lo bueno se disfruta más cuando sabemos que no es eterno.',q:'El tiempo es un río de sucesos, y su corriente es impetuosa.',qa:'Marco Aurelio, Meditaciones',bk:'Meditaciones, de Marco Aurelio'},
 s5:{tr:['estoicismo'],idea:'Se cuenta que en los desfiles de victoria de Roma, un esclavo susurraba al general: «recuerda que eres mortal». Los estoicos convirtieron esto en una práctica diaria. No es una idea triste: recordar que el tiempo es limitado nos ayuda a dejar de posponer, a perdonar antes y a valorar lo que tenemos hoy.',q:'No es que tengamos poco tiempo, sino que perdemos mucho.',qa:'Séneca, Sobre la brevedad de la vida',bk:'Sobre la brevedad de la vida, de Séneca'},
 s6:{tr:['estoicismo'],idea:'«Amor fati» significa amar el destino: no solo aceptar lo que ocurre, sino abrazarlo como material para crecer. Epicteto aconsejaba querer que las cosas sucedan como suceden. Siglos después, Friedrich Nietzsche lo llamó su fórmula para la grandeza. La práctica consiste en preguntarse ante cada dificultad: ¿qué puedo aprender o construir con esto?',q:'No pretendas que los sucesos sucedan como quieres, sino quiere que sucedan como suceden.',qa:'Epicteto, Enquiridión',bk:'El obstáculo es el camino, de Ryan Holiday'},
 s7:{tr:['taoismo'],idea:'Wu wei suele traducirse como «no hacer», pero no significa pereza. Es actuar sin forzar, como el agua que rodea la piedra en lugar de chocar con ella y, con el tiempo, la desgasta. En la vida diaria es elegir el momento adecuado, no empujar lo que aún no está listo y dejar de gastar energía peleando contra la corriente.',q:'Nada en el mundo es más blando que el agua, y nada la supera para vencer lo duro.',qa:'Lao Tse, Tao Te Ching',bk:'Tao Te Ching, de Lao Tse'},
 s8:{tr:['budismo'],idea:'Upādāna, el apego, es aferrarse a algo con la idea de que sin ello no podemos estar bien: una persona, un objeto, una posición o una opinión. El desapego budista no es dejar de amar ni de tener, sino tener sin depender. Puedes disfrutar de lo que tienes sabiendo que tu paz no está en eso.',q:'Quien sabe que tiene suficiente es rico.',qa:'Lao Tse, Tao Te Ching',bk:'Cuando todo se derrumba, de Pema Chödrön'},
 s9:{tr:['contemplativas','psicologia'],idea:'',by:{contemplativas:'El perdón aparece en casi todas las tradiciones espirituales. En el Budismo se cultiva con la meditación metta, de bondad amorosa, que desea el bien incluso a quien nos hirió; en el cristianismo es central, como recuerda el Padre Nuestro. Ambas lo ven como una forma de liberar el propio corazón, más que de absolver al otro.',psicologia:'La psicología lo estudia como herramienta de salud: guardar rencor mantiene al cuerpo en estado de alerta y estrés, y perdonar se asocia con menos ansiedad y depresión. Investigadores como Fred Luskin, de la Universidad de Stanford, lo aclaran: perdonar no significa justificar lo que pasó ni volver a confiar en quien te dañó, sino decidir que ese recuerdo ya no dirija tu vida.'},q:'Aferrarse a la ira es como sostener un carbón encendido para arrojárselo a otro: el que se quema eres tú.',qa:'Frase atribuida popularmente a Buda',bk:'El libro del perdón, de Desmond Tutu y Mpho Tutu'},
 s10:{tr:['emocional','estoicismo'],idea:'Entre lo que nos pasa y lo que hacemos hay un pequeño espacio. Dos disciplinas explican cómo aprovecharlo.',by:{emocional:'Daniel Goleman explica que, ante una amenaza, la amígdala (el centro de alarma del cerebro) puede «secuestrar» nuestra conducta antes de que pensemos. Reaccionar es actuar desde ese secuestro; responder es dar unos segundos para que intervenga la parte racional. Goleman llama a esta habilidad autorregulación, uno de los pilares de la inteligencia emocional.',estoicismo:'Dos mil años antes, Epicteto enseñaba que no nos perturban los hechos, sino lo que pensamos de ellos. Los estoicos practicaban no dar su «asentimiento» inmediato a la primera impresión: hacer una pausa y preguntarse si es verdad y si depende de uno. Séneca, en su libro Sobre la ira, decía que el mejor remedio contra el enojo es la demora.'},q:'No nos perturban las cosas, sino las opiniones que tenemos de ellas.',qa:'Epicteto, Enquiridión',bk:'Inteligencia emocional, de Daniel Goleman'},
 s11:{tr:['hermetismo'],idea:'El principio de correspondencia dice que existe una relación entre los distintos planos de la realidad: lo de arriba con lo de abajo, lo interior con lo exterior. Llevado a la vida diaria, sugiere que nuestro mundo externo (relaciones, orden, finanzas) suele reflejar nuestro mundo interno (creencias, emociones, hábitos). Cambiar por dentro es el primer paso para cambiar por fuera.',q:'Como es arriba, es abajo; como es adentro, es afuera.',qa:'Tabla Esmeralda (frase hermética tradicional)',bk:'El Kybalión, de Tres Iniciados'},
 s12:{tr:['hermetismo'],idea:'El principio de ritmo enseña que todo fluye y refluye, como las mareas, las estaciones o el día y la noche. Los estados de ánimo, la energía y hasta las épocas económicas también tienen ciclos. Saberlo ayuda a no creer que un mal día es para siempre, ni que un buen momento durará sin cuidado: en la caída se prepara la subida.',q:'Todo fluye y refluye; todo tiene sus períodos de avance y retroceso.',qa:'El Kybalión',bk:'El Kybalión, de Tres Iniciados'},
 s13:{tr:['budismo'],idea:'Es la cuarta noble verdad en la práctica: ocho áreas de la vida que se cultivan al mismo tiempo. Comprensión correcta, intención correcta, palabra correcta, acción correcta, forma de vida correcta, esfuerzo correcto, atención correcta y concentración correcta. «Correcto» aquí no significa perfecto, sino equilibrado: un camino medio entre los excesos.',q:'Tú mismo debes hacer el esfuerzo; los maestros solo señalan el camino.',qa:'Dhammapada',bk:'Dhammapada (enseñanzas de Buda)'},
 s14:{tr:['budismo'],idea:'Śūnyatā, la vacuidad, no significa que nada importe. Significa que nada existe de forma aislada: una taza de té contiene la lluvia que regó la planta, el trabajo de quien la cosechó y el sol que la hizo crecer. Thich Nhat Hanh llamó a esto «interser». Entenderlo reduce la soledad y aumenta la gratitud y la compasión.',q:'Si eres poeta, verás claramente que hay una nube flotando en esta hoja de papel.',qa:'Thich Nhat Hanh',bk:'El corazón de la comprensión, de Thich Nhat Hanh'},
 m1:{tr:['dinero'],idea:'Las creencias sobre el dinero se forman antes de los diez años, escuchando lo que dicen y hacen nuestros padres: «el dinero es sucio», «los ricos son malos», «no alcanza». Los investigadores las llaman «guiones del dinero» y muestran que influyen en cuánto ganamos, gastamos y ahorramos en la adultez. Identificarlas es el primer paso para elegir otras.',q:'Hacer dinero es una cosa; conservarlo es otra muy distinta.',qa:'Morgan Housel (idea central de su libro)',bk:'La psicología del dinero, de Morgan Housel'},
 m2:{tr:['psicologia'],idea:'Todos tenemos un diálogo interno que comenta lo que hacemos. Aaron Beck descubrió que muchas veces ese diálogo cae en «distorsiones»: exagerar lo malo, generalizar («siempre me pasa») o adivinar lo que piensan otros. La reestructuración cognitiva enseña a detectar esos pensamientos y cuestionarlos con preguntas sencillas: ¿es cierto?, ¿qué evidencia tengo?',q:'Los hombres no se perturban por las cosas, sino por la visión que tienen de ellas.',qa:'Epicteto, citado por Albert Ellis como origen de su terapia',bk:'Sentirse bien, de David D. Burns'},
 m3:{tr:['finanzas'],idea:'En El hombre más rico de Babilonia (1926), George S. Clason cuenta la historia de Arkad, que se hizo rico con una regla sencilla: guardar al menos una décima parte de todo lo que ganaba antes de pagar cualquier otra cosa. La lógica es que si ahorras lo que sobra, nunca sobra nada; si ahorras primero, aprendes a vivir con el resto.',q:'Una parte de todo lo que ganas te pertenece para que la conserves.',qa:'George S. Clason, El hombre más rico de Babilonia',bk:'El hombre más rico de Babilonia, de George S. Clason'},
 m4:{tr:['finanzas'],idea:'Un presupuesto no es una cárcel, es un mapa. Registrar los gastos durante un mes suele revelar «fugas»: pequeños consumos que, sumados, son grandes. Un método popular es la regla 50/30/20: la mitad del ingreso para necesidades, 30% para gustos y 20% para ahorro y deudas. Lo importante no es la fórmula exacta, sino decidir a dónde va tu dinero antes de que se vaya solo.',q:'Cuidado con los pequeños gastos: una pequeña fuga hunde un gran barco.',qa:'Benjamin Franklin',bk:'La transformación total de su dinero, de Dave Ramsey'},
 m5:{tr:['finanzas'],idea:'El fondo de emergencia es dinero reservado solo para imprevistos: una enfermedad, una reparación, perder el trabajo. La recomendación general es reunir entre tres y seis meses de gastos básicos, empezando por una meta pequeña. Su valor no es solo económico: saber que tienes un respaldo reduce la ansiedad y te permite decidir con calma.',q:'El prudente ve el peligro y se pone a salvo.',qa:'Libro de los Proverbios',bk:'La psicología del dinero, de Morgan Housel'},
 m6:{tr:['finanzas'],idea:'El método «bola de nieve» consiste en ordenar las deudas de la más pequeña a la más grande, pagar el mínimo en todas y poner cada dólar extra en la más pequeña. Al saldarla, ese pago se suma a la siguiente, y así la bola crece. Matemáticamente no siempre es lo más barato, pero funciona porque cada pequeña victoria da motivación para seguir.',q:'El que pide prestado es siervo del que presta.',qa:'Libro de los Proverbios',bk:'La transformación total de su dinero, de Dave Ramsey'},
 m7:{tr:['finanzas'],idea:'Robert Kiyosaki simplificó la contabilidad en una regla: un activo pone dinero en tu bolsillo (un negocio, una inversión, un alquiler) y un pasivo lo saca (deudas de consumo, gastos que se deprecian). La clase media suele comprar pasivos creyendo que son activos. La propuesta es destinar parte de tus ingresos a adquirir cosas que generen ingresos.',q:'Los ricos adquieren activos; los pobres y la clase media adquieren pasivos que creen que son activos.',qa:'Robert Kiyosaki, Padre rico, padre pobre',bk:'Padre rico, padre pobre, de Robert Kiyosaki'},
 m8:{tr:['inversion'],idea:'El interés compuesto es ganar intereses sobre los intereses. Si inviertes 100 dólares al 8% anual, en 10 años tendrás unos 216; en 30 años, más de 1.000, sin agregar nada. El secreto no es cuánto inviertes al principio, sino cuánto tiempo dejas que crezca. Por eso empezar temprano, aunque sea con poco, vale más que empezar tarde con mucho.',q:'Mi riqueza ha venido de vivir en Estados Unidos, algunos genes afortunados y el interés compuesto.',qa:'Warren Buffett',bk:'El inversor inteligente, de Benjamin Graham'},
 m9:{tr:['exito'],idea:'En su ensayo Compensación (1841), Emerson sostiene que en la vida todo tiende al equilibrio: lo que das, de alguna forma, vuelve. Aplicado al trabajo, significa que tus ingresos crecen en proporción al valor que aportas a otros. En lugar de preguntarte «¿cómo gano más?», la pregunta es «¿cómo puedo servir mejor o a más personas?».',q:'Cada acto se recompensa a sí mismo.',qa:'Ralph Waldo Emerson, Compensación',bk:'Ensayos, de Ralph Waldo Emerson'},
 m10:{tr:['habitos'],idea:'BJ Fogg descubrió que los hábitos duraderos empiezan ridículamente pequeños: una flexión, una línea escrita, un dólar ahorrado. James Clear agrega que mejorar un 1% cada día lleva, al cabo de un año, a ser unas 37 veces mejor. El truco es enfocarse en el sistema (lo que haces cada día) más que en la meta.',q:'Somos lo que hacemos repetidamente. La excelencia no es un acto, sino un hábito.',qa:'Will Durant, resumiendo a Aristóteles',bk:'Hábitos atómicos, de James Clear'},
 m11:{tr:['crecimiento'],idea:'Carol Dweck encontró dos formas de ver nuestras capacidades. Con mentalidad fija, un fracaso confirma que «no sirvo para esto». Con mentalidad de crecimiento, el fracaso es información: muestra qué falta aprender. Sus estudios con miles de estudiantes muestran que esta segunda forma de pensar se puede aprender y mejora los resultados.',q:'No he fracasado. He encontrado diez mil formas que no funcionan.',qa:'Atribuido a Thomas Edison',bk:'Mindset: la actitud del éxito, de Carol Dweck'},
 m12:{tr:['inversion'],idea:'Diversificar es repartir el dinero entre distintas inversiones para que, si a una le va mal, las demás compensen. Harry Markowitz demostró en 1952 que una cartera variada reduce el riesgo sin sacrificar mucho la ganancia. Lo mismo vale para los ingresos: depender de una sola fuente te hace vulnerable.',q:'Reparte tu porción entre siete, y aun entre ocho, porque no sabes qué mal vendrá.',qa:'Eclesiastés',bk:'Un paseo aleatorio por Wall Street, de Burton Malkiel'},
 m13:{tr:['profesional'],idea:'Gary Becker mostró que la educación y las habilidades son una inversión con retorno: quien aprende algo valioso aumenta lo que puede ganar durante toda su vida. Tu talento es el único activo que nadie te puede quitar y que se multiplica al usarlo. Invertir tiempo y dinero en aprender suele ser la inversión más rentable.',q:'Invertir en conocimiento paga el mejor interés.',qa:'Benjamin Franklin',bk:'Tan bueno que no podrán ignorarte, de Cal Newport'},
 v1:{tr:['estilo','sueno'],idea:'Nuestro reloj interno se ajusta cada mañana con la luz. Exponerte a luz natural en la primera hora del día le indica al cuerpo que es de día: sube el cortisol de forma sana, mejora el ánimo y, unas 14 a 16 horas después, se libera la melatonina que nos ayuda a dormir. Tomar agua al despertar repone lo perdido durante la noche.',q:'Pronto a la cama y pronto a levantarse hacen al hombre sano, rico y sabio.',qa:'Benjamin Franklin',bk:'Por qué dormimos, de Matthew Walker'},
 v2:{tr:['ejercicio','estilo'],idea:'La Organización Mundial de la Salud recomienda al menos 150 minutos de actividad moderada por semana, unos 22 minutos al día. Caminar a paso ligero cumple ese objetivo y se asocia con menos riesgo de enfermedades del corazón, diabetes y depresión. Además, caminar ayuda a pensar: muchos filósofos, de Aristóteles a Nietzsche, pensaban caminando.',q:'Caminar es el mejor remedio del hombre.',qa:'Atribuido a Hipócrates',bk:'Exercised, de Daniel Lieberman'},
 v3:{tr:['nutricion'],idea:'La clasificación NOVA, creada en la Universidad de São Paulo, divide los alimentos según cuánto han sido procesados: desde naturales (frutas, granos, huevos) hasta ultraprocesados (productos industriales con ingredientes que no usarías en tu cocina). Muchos estudios asocian el alto consumo de ultraprocesados con más riesgo de obesidad y enfermedades crónicas.',q:'Come comida. No demasiada. Sobre todo plantas.',qa:'Michael Pollan',bk:'El detective en el supermercado, de Michael Pollan'},
 v4:{tr:['sueno'],idea:'La higiene del sueño son los hábitos que preparan al cuerpo para descansar: horarios regulares, luz natural de día, poca luz de noche, evitar la cafeína por la tarde y un dormitorio fresco y oscuro. Dormir bien no empieza al apagar la luz: empieza al despertar, porque lo que haces de día define cómo duermes de noche.',q:'El sueño es la cadena de oro que une la salud y el cuerpo.',qa:'Thomas Dekker',bk:'Por qué dormimos, de Matthew Walker'},
 v5:{tr:['contemplativas','estilo'],idea:'',by:{contemplativas:'El yoga de la India llama a estas técnicas pranayama, «control de la energía vital», y las practica desde hace miles de años; en el Budismo, la meditación anapanasati consiste simplemente en observar la respiración. Para estas tradiciones, la respiración es el puente entre el cuerpo y la mente.',estilo:'La fisiología explica por qué funcionan: respirar lento, sobre todo con exhalaciones más largas que las inhalaciones, activa el sistema nervioso parasimpático, el encargado de la calma. En pocos minutos baja el ritmo cardíaco y la presión arterial. Por eso la medicina del estilo de vida la recomienda como herramienta contra el estrés.'},q:'Los sentimientos vienen y van como nubes en un cielo con viento. La respiración consciente es mi ancla.',qa:'Thich Nhat Hanh',bk:'Respira, de James Nestor'},
 v6:{tr:['nutricion'],idea:'El «plato para comer saludable» de la Universidad de Harvard propone una guía visual sencilla: la mitad del plato con verduras y frutas, un cuarto con granos integrales y un cuarto con proteína saludable, acompañado de agua. Las plantas aportan fibra, vitaminas y antioxidantes, y alimentan a las bacterias buenas del intestino.',q:'Que tu alimento sea tu medicina.',qa:'Frase atribuida a Hipócrates',bk:'Eat, Drink, and Be Healthy, de Walter Willett'},
 v7:{tr:['ejercicio'],idea:'Desde los 30 años perdemos masa muscular poco a poco, y esa pérdida se acelera con la edad. El entrenamiento de fuerza, al menos dos días por semana según la OMS, protege los huesos, mejora el equilibrio, regula el azúcar en la sangre y mantiene la independencia en la vejez. No hace falta un gimnasio: el peso del cuerpo es suficiente para empezar.',q:'La falta de actividad destruye la buena condición de todo ser humano; el movimiento y el ejercicio la conservan.',qa:'Atribuido a Platón',bk:'Outlive, de Peter Attia'},
 v8:{tr:['atencion','nutricion'],idea:'',by:{atencion:'Comer con atención plena nace de la práctica budista de estar presente en cada acción. Thich Nhat Hanh enseñaba a comer en silencio, masticando despacio y notando los sabores, las texturas y el camino que recorrió cada alimento hasta llegar a la mesa.',nutricion:'La nutrición explica sus beneficios: el estómago tarda unos 20 minutos en avisar al cerebro que está lleno, así que comer despacio ayuda a comer lo justo. Masticar bien mejora la digestión, y comer sin pantallas reduce los atracones.'},q:'Cuando comas, solo come.',qa:'Proverbio zen',bk:'Saborear, de Thich Nhat Hanh y Lilian Cheung'},
 v9:{tr:['sueno'],idea:'La luz de las pantallas, sobre todo la azul, le dice al cerebro que todavía es de día y retrasa la liberación de melatonina, la hormona del sueño. Además, el contenido estimula la mente. Dejar las pantallas entre 30 y 60 minutos antes de dormir, y cambiarlas por lectura o conversación, suele mejorar la calidad del descanso.',q:'Una buena carcajada y un largo sueño son la mejor cura.',qa:'Proverbio irlandés',bk:'Por qué dormimos, de Matthew Walker'},
 v10:{tr:['nutricion'],idea:'Los «azúcares libres» son los que se agregan a los productos más los de jugos y mieles. La OMS recomienda que sean menos del 10% de la energía diaria, y lo ideal es bajar al 5%: unas seis cucharaditas al día. Muchos productos «salados» o «saludables», como salsas, panes o yogures, tienen azúcar escondido; leer las etiquetas es la mejor defensa.',q:'Lo poco agrada y lo mucho enfada.',qa:'Refrán popular',bk:'Sugar Blues, de William Dufty'},
 v11:{tr:['estilo'],idea:'Pasar muchas horas sentado afecta la salud incluso en personas que hacen ejercicio. Las investigaciones muestran que levantarse unos minutos cada 30 o 60 minutos mejora la circulación, el azúcar en la sangre y la concentración. Las «pausas activas» son pequeñas interrupciones que se suman a lo largo del día.',q:'Solo los pensamientos que nacen caminando tienen valor.',qa:'Friedrich Nietzsche, El ocaso de los ídolos',bk:'Exercised, de Daniel Lieberman'},
 v12:{tr:['estilo'],idea:'En 1982, el gobierno de Japón promovió el shinrin-yoku, «baño de bosque»: pasear despacio entre árboles con los cinco sentidos. Los estudios muestran que reduce el cortisol, la presión arterial y el ritmo cardíaco, y mejora el ánimo. No hace falta un bosque: un parque, un jardín o un rato bajo el cielo también ayudan.',q:'Mira profundamente la naturaleza y entonces comprenderás todo mejor.',qa:'Atribuido a Albert Einstein',bk:'Shinrin-yoku, de Qing Li'},
 v13:{tr:['estilo','psicologia'],idea:'',by:{estilo:'La medicina del estilo de vida incluye las relaciones sanas como uno de sus seis pilares de salud. Las investigaciones muestran que la soledad prolongada afecta la salud tanto como fumar y aumenta el riesgo de enfermedades del corazón.',psicologia:'El Estudio de Harvard sobre el Desarrollo Adulto sigue la vida de cientos de personas desde 1938. Su conclusión más clara: lo que más predice una vida larga y feliz no es el dinero ni la fama, sino la calidad de nuestras relaciones.'},end:'Cuidar a las personas cercanas es también cuidar el cuerpo.',q:'Sin amigos, nadie querría vivir, aunque tuviera todos los demás bienes.',qa:'Aristóteles, Ética a Nicómaco',bk:'Una buena vida, de Robert Waldinger y Marc Schulz'}
};
/* ---- Contenido ampliado de cada cápsula: más explicación, pasos para aplicarlo y, en Prosperidad y Vitalidad, la voz de un experto ---- */
var DEEP={
 s1:{more:['Piensa en un día cualquiera: el tráfico, el humor de tu jefe, la respuesta que alguien tarda en dar. Ninguna de esas cosas está en tus manos, y sin embargo pueden ocupar horas de tu mente. Ahora piensa en lo que sí depende de ti: cómo interpretas lo que pasa, qué decides hacer después y con qué actitud lo haces.','Esta separación no te vuelve indiferente. Al contrario: cuando dejas de gastar energía en lo que no controlas, tienes mucha más para lo que sí. Un deportista no controla el resultado del partido, pero sí su preparación, su esfuerzo y su concentración. Ahí pone todo.'],
  steps:['Cuando algo te inquiete, detente y pregúntate: «¿esto depende de mí?».','Si depende de ti, define una acción concreta y pequeña para hoy.','Si no depende de ti, suéltalo conscientemente: «hice lo que me tocaba».']},
 s2:{more:['Hay una diferencia entre el dolor y el sufrimiento. El dolor es lo que pasa: una pérdida, una enfermedad, un rechazo. El sufrimiento es lo que agregamos encima: «esto no debería pasarme», «siempre me pasa a mí», «nunca voy a superarlo». Es como recibir una flecha y luego clavarnos una segunda con nuestros propios pensamientos.','La primera flecha muchas veces no la podemos evitar. La segunda, sí. Observar la diferencia entre ambas es una de las habilidades más liberadoras que existen, y se entrena con la práctica.'],
  steps:['Cuando algo te duela, describe en una frase solo el hecho, sin juicios.','Luego escribe los pensamientos que le estás agregando.','Pregúntate cuáles de esos pensamientos te ayudan y cuáles solo aumentan el dolor.']},
 s3:{more:['Desde niños aprendemos que portarnos «bien» trae cariño y aprobación. Es natural que de adultos sigamos buscando esa señal. El problema aparece cuando decidimos qué decir, qué publicar o cómo vestirnos según lo que otros pensarán, y no según lo que queremos o creemos.','Una señal clara de que la aprobación se volvió necesidad: un comentario negativo te arruina el día, aunque recibas diez positivos. La solución no es dejar de escuchar a los demás, sino tener tus propios valores claros, para que la opinión ajena sea información y no una sentencia.'],
  steps:['Escribe tres valores que quieras que guíen tus decisiones (por ejemplo: honestidad, libertad, servicio).','Ante una decisión, pregúntate cuál de ellos honra y cuál traiciona.','Cuando recibas una crítica, separa lo que te sirve de lo que solo hiere, y quédate con lo primero.']},
 s4:{more:['Mira una fotografía tuya de hace diez años: tu cuerpo, tus ideas, tus amistades y tus preocupaciones cambiaron. Nada de lo que vives hoy será exactamente igual dentro de un año. Solemos resistirnos a esto porque queremos asegurar lo bueno, pero esa resistencia nos hace sufrir.','Aceptar que todo cambia tiene dos regalos. Primero, alivio: lo difícil también terminará. Segundo, gratitud: lo valioso se vuelve más valioso cuando sabemos que no es eterno. Las personas que abrazan el cambio se adaptan mejor y disfrutan más el presente.'],
  steps:['Cuando vivas un momento difícil, repite: «esto también pasará».','Cuando vivas un momento bueno, dedica unos segundos a disfrutarlo con plena atención.','Escribe un cambio de tu vida que al principio te asustó y que terminó siendo positivo.']},
 s5:{more:['Vivimos como si tuviéramos tiempo infinito: «el próximo año empiezo», «algún día viajaré», «después le digo que lo quiero». Recordar que el tiempo es limitado no busca darte miedo, sino claridad. Muchas personas que enfrentaron una enfermedad grave cuentan que, desde ese día, dejaron de perder tiempo en lo que no importaba.','Una enfermera que acompañó a pacientes en sus últimos días recopiló sus arrepentimientos más comunes: no haberse atrevido a vivir según sus propios deseos, haber trabajado demasiado, no haber expresado sus sentimientos y haber perdido contacto con sus amigos. Casi ninguno se arrepentía de lo que había hecho; se arrepentían de lo que habían postergado.'],
  steps:['Escribe tres cosas importantes que estás posponiendo.','Elige una y da el primer paso esta semana, aunque sea pequeño.','Cada noche, pregúntate: «¿hoy viví de acuerdo con lo que más me importa?».']},
 s6:{more:['Hay dos formas de cargar con el pasado. Una es como una herida: «si no me hubiera pasado eso, mi vida sería mejor». La otra es como un material: «eso que pasó me enseñó, me hizo más fuerte o me llevó a donde estoy». Los hechos son los mismos; lo que cambia es la historia que te cuentas.','Esto no significa fingir que todo fue bueno. Significa dejar de pelear con lo que ya no se puede cambiar y usar tu energía para construir desde ahí. Muchas de las personas más admirables convirtieron su mayor dificultad en su mayor propósito.'],
  steps:['Elige una situación difícil de tu vida que todavía te pese.','Escribe cómo la cuentas hoy, y luego reescríbela como una historia de aprendizaje.','Lee la nueva versión cada vez que el recuerdo vuelva.']},
 s7:{more:['Hay momentos en que todo cuesta: insistes en una conversación que no avanza, en un proyecto que no despega, en convencer a alguien que no quiere escuchar. Más esfuerzo no siempre trae más resultados; a veces trae más resistencia. Fluir es reconocer cuándo empujar y cuándo esperar.','Piensa en un buen surfista: no pelea contra la ola, la lee y se deja llevar en el momento justo. En la vida diaria, fluir es observar antes de actuar, elegir el momento adecuado y aceptar que algunas cosas maduran a su ritmo.'],
  steps:['Identifica una situación en la que sientas que estás empujando sin resultado.','Durante tres días, en lugar de insistir, observa: ¿qué está pasando realmente?','Al final, elige una acción más suave o un mejor momento para actuar.']},
 s8:{more:['El apego es la sensación de que no podrías estar bien sin algo: una relación, un trabajo, un objeto o la imagen que tienes de ti. Cuanto más fuerte es, más miedo sientes de perderlo, y ese miedo termina arruinando el disfrute.','El desapego no es frialdad ni renuncia. Es amar, trabajar y tener con la mano abierta: disfrutas de lo que tienes, cuidas lo que amas, pero sabes que tu paz no depende de que nada cambie. Paradójicamente, las personas desapegadas suelen disfrutar más de lo que tienen.'],
  steps:['Revisa tu casa y elige tres objetos que guardas «por si acaso» y no usas. Regálalos.','Observa qué sientes antes y después de soltarlos.','Piensa en algo que temes perder y escribe qué harías si sucediera: descubrirás que eres más fuerte de lo que crees.']},
 s9:{more:['Perdonar es una de las decisiones más malinterpretadas. No significa decir que lo que pasó estuvo bien, ni volver a confiar en quien te hizo daño, ni olvidar. Significa dejar de cargar con el resentimiento, que es como un peso que solo lastima a quien lo lleva.','El perdón también es un proceso, no un momento. A veces hay que perdonar la misma herida varias veces, hasta que el recuerdo ya no duela igual. Y a menudo, la persona a quien más nos cuesta perdonar somos nosotros mismos.'],
  steps:['Piensa en alguien a quien te cueste perdonar y escribe lo que sientes, sin filtro.','Escribe qué necesitarías para soltar ese peso, aunque la otra persona nunca cambie.','Repite cada mañana durante una semana: «elijo mi paz por encima de mi rencor».']},
 s10:{more:['Cuando algo nos molesta, el cerebro activa una alarma muy rápida, más rápida que el pensamiento. Por eso a veces decimos o hacemos cosas de las que luego nos arrepentimos. No es que seamos malas personas: es que actuamos antes de pensar.','La buena noticia es que ese espacio entre lo que pasa y lo que hacemos se puede ampliar con práctica. Basta con unos segundos: respirar, nombrar la emoción («estoy enojado») o preguntarse «¿qué es lo más sabio que puedo hacer ahora?». Con el tiempo, responder se vuelve más natural que reaccionar.'],
  steps:['Cuando sientas una emoción fuerte, haz tres respiraciones lentas antes de hablar.','Nombra la emoción en voz baja: «siento frustración».','Pregúntate: «¿qué respuesta me hará sentir orgulloso mañana?».']},
 s11:{more:['Observa tu entorno: tu escritorio, tu agenda, tus conversaciones. Muchas veces reflejan cómo te sientes por dentro. Cuando estamos agobiados, todo se desordena; cuando estamos en calma, ponemos orden casi sin darnos cuenta.','La relación funciona en ambas direcciones. Cambiar tu mundo interno transforma lo de afuera, y ordenar lo de afuera también calma lo de adentro. Por eso ordenar un cajón puede mejorar tu ánimo, y cambiar una creencia puede cambiar tus resultados.'],
  steps:['Elige un área de tu vida que sientas desordenada (casa, finanzas, relaciones).','Escribe qué crees o sientes sobre esa área.','Haz un cambio pequeño afuera y otro adentro, y observa cómo se influyen.']},
 s12:{more:['La naturaleza funciona por ciclos: el día y la noche, las estaciones, las mareas. Nosotros también. Hay semanas de mucha energía y otras en las que todo cuesta; épocas de crecimiento y otras de pausa. El problema no son los ciclos, sino creer que el momento actual será para siempre.','Quien conoce su ritmo aprovecha mejor cada etapa: en los momentos altos, avanza y siembra; en los bajos, descansa, reflexiona y se prepara. Así, la caída deja de ser un fracaso y se convierte en parte natural del camino.'],
  steps:['Durante una semana, anota cada noche tu nivel de energía y ánimo.','Identifica en qué momentos del día o de la semana te sientes mejor.','Planifica tus tareas más importantes para tus momentos altos.']},
 s13:{more:['Esta guía propone ocho áreas que se cultivan al mismo tiempo, como las raíces de un árbol. Se pueden agrupar en tres: sabiduría (cómo ves la vida y qué intenciones tienes), conducta (cómo hablas, actúas y te ganas la vida) y mente (tu esfuerzo, tu atención y tu concentración).','No se trata de ser perfecto en las ocho, sino de avanzar en equilibrio, sin irse a los extremos. Es un camino medio: ni exigirse hasta el agotamiento, ni abandonarse. Cada pequeña mejora en un área ayuda a las demás.'],
  steps:['Califica del 1 al 10 cómo estás hoy en las tres áreas: sabiduría, conducta y mente.','Elige la más baja y define una acción concreta para mejorarla.','Practícala todos los días y vuelve a calificarte al final de la semana.']},
 s14:{more:['Piensa en la ropa que llevas puesta: alguien sembró el algodón, alguien lo tejió, alguien lo transportó y alguien lo vendió. Lo mismo ocurre con tu comida, tu casa y hasta tus ideas, que aprendiste de otros. Nada de lo que eres existe de forma aislada.','Comprender esto cambia la forma en que vives. Reduce la soledad, porque estás conectado con todo; reduce el ego, porque nadie se hace solo; y aumenta la gratitud y la compasión, porque lo que haces a otros, de alguna manera, te lo haces a ti.'],
  steps:['Elige un objeto que uses todos los días y piensa en todas las personas que lo hicieron posible.','Agradece en voz alta a alguien que contribuyó a tu vida y nunca se lo dijiste.','Realiza un acto de amabilidad anónimo esta semana.']},

 m1:{more:['Nuestras ideas sobre el dinero se forman antes de los diez años, escuchando lo que dicen y viendo lo que hacen nuestros padres. Si en tu casa el dinero era motivo de peleas, quizá hoy lo evitas. Si se decía que «los ricos son ambiciosos», quizá te sientes culpable cuando ganas más. Estas creencias funcionan en automático y sabotean decisiones sin que te des cuenta.','Las creencias más comunes son: «el dinero es la raíz de todos los males», «no soy bueno con los números», «hay que trabajar muy duro para ganar poco» o «si gano más, voy a cambiar como persona». El primer paso es identificarlas; el segundo, cuestionarlas con evidencia; el tercero, reemplazarlas por una idea más útil.'],
  steps:['Escribe las frases sobre el dinero que escuchabas en tu infancia.','Al lado de cada una, pregúntate: «¿es 100% cierta? ¿qué evidencia tengo en contra?».','Reescribe cada frase en una versión que te impulse y léela cada mañana.'],
  exp:{who:'T. Harv Eker',bk:'Los secretos de la mente millonaria',t:'Eker propone que cada persona tiene un «modelo financiero» interno, formado en la infancia, que determina sus resultados económicos. Según él, si no cambias ese modelo, aunque ganes más dinero tenderás a volver a tu nivel anterior. Por eso trabaja primero sobre las creencias y después sobre las técnicas.'}},
 m2:{more:['Todos tenemos una voz interior que comenta lo que hacemos. A veces es útil, pero muchas veces repite frases aprendidas: «no eres suficiente», «eso no es para ti», «vas a fracasar». La psicología llama a esto pensamientos automáticos: aparecen solos, parecen verdades y casi nunca los cuestionamos.','Las distorsiones más comunes son: todo o nada («si no es perfecto, es un fracaso»), generalizar («siempre me sale mal»), adivinar el futuro («no me van a contratar») y leer la mente («seguro piensan que soy un tonto»). Aprender a reconocerlas te permite responderles con más objetividad.'],
  steps:['Durante una semana, anota cada pensamiento negativo que tengas sobre tu capacidad.','Al lado, escribe qué distorsión es: todo o nada, generalizar, adivinar o leer la mente.','Reescríbelo como lo diría un buen amigo que te conoce y te quiere.'],
  exp:{who:'Napoleon Hill',bk:'Piense y hágase rico',t:'Hill entrevistó durante veinte años a cientos de personas exitosas, como Andrew Carnegie y Henry Ford. Concluyó que todas compartían un rasgo: controlaban sus pensamientos. Para él, la autosugestión, es decir, repetirte con convicción lo que quieres lograr, es la herramienta para reprogramar la mente.'}},
 m3:{more:['¿Por qué ahorrar «lo que sobra» casi nunca funciona? Porque los gastos tienden a crecer hasta igualar los ingresos: si ganas más, también gastas más. Al apartar tu parte primero, el ahorro deja de depender de la fuerza de voluntad de fin de mes.','La clave está en automatizarlo. Si cada mes tienes que decidir si ahorras, la tentación de gastar suele ganar. Si el ahorro sale solo el día que cobras, aprendes a vivir con el resto sin esfuerzo. Empieza con el 5% si el 10% te parece mucho; lo importante es empezar y subir poco a poco.'],
  steps:['Decide qué porcentaje de tus ingresos vas a apartar (entre el 5% y el 20%).','Abre una cuenta de ahorro separada, idealmente en otro banco, para no verla todos los días.','Programa una transferencia automática el mismo día que recibes tu ingreso.'],
  exp:{who:'George S. Clason',bk:'El hombre más rico de Babilonia',t:'En esta fábula de 1926, Arkad, el hombre más rico de Babilonia, enseña siete remedios para una bolsa vacía. El primero es apartar al menos una décima parte de todo lo que ganas. El segundo, controlar los gastos. El tercero, hacer que el oro ahorrado se multiplique trabajando para ti.'}},
 m4:{more:['Cuando las personas registran sus gastos por primera vez, suelen descubrir «gastos hormiga»: pequeñas compras diarias, como un café, un antojo o una suscripción olvidada, que sumadas al mes representan una cantidad sorprendente.','Un método sencillo para ordenar tu dinero es la regla 50/30/20: destina el 50% de tus ingresos a necesidades (vivienda, comida, transporte), el 30% a deseos (salidas, ropa, entretenimiento) y el 20% a ahorro y pago de deudas. No tiene que ser exacta: es una guía para saber si estás en equilibrio.'],
  steps:['Durante siete días, anota cada gasto, por pequeño que sea, en tu celular o en una libreta.','Al final, clasifícalos en necesidades, deseos y ahorro.','Compara con la regla 50/30/20 e identifica un gasto hormiga que puedas reducir.'],
  exp:{who:'Elizabeth Warren',bk:'All Your Worth',t:'La senadora y profesora de Harvard, especialista en quiebras familiares, popularizó la regla 50/30/20 junto con su hija Amelia Warren Tyagi. Su investigación mostró que muchas familias no quiebran por lujos, sino por tener gastos fijos demasiado altos que no dejan margen ante cualquier imprevisto.'}},
 m5:{more:['Este fondo es solo para imprevistos reales: perder el trabajo, una enfermedad, una reparación urgente. No es para vacaciones ni para aprovechar una oferta. Esa disciplina es la que lo hace funcionar: cuando llega el problema, el dinero está ahí.','Si reunir varios meses te parece mucho, empieza con una meta pequeña, como un mes de gastos o una cantidad fija. Guárdalo en un lugar seguro y de fácil acceso, pero separado de tu cuenta diaria, para no usarlo en gastos que no son emergencias.'],
  steps:['Suma tus gastos básicos de un mes: vivienda, comida, servicios, transporte y salud.','Define tu primera meta: un mes de esos gastos.','Abre una cuenta separada y deposita algo cada semana, aunque sea poco.'],
  exp:{who:'Dave Ramsey',bk:'La transformación total de su dinero',t:'Ramsey propone siete «pasos de bebé» para ordenar las finanzas. El primero es reunir un pequeño fondo de emergencia inicial, antes incluso de atacar las deudas, para no endeudarse más ante cualquier imprevisto. Una vez libre de deudas, recomienda completar un fondo de tres a seis meses de gastos.'}},
 m6:{more:['Las deudas generan un círculo difícil: pagas intereses, te queda menos dinero, y para cubrir lo que falta te vuelves a endeudar. Para romperlo, tu lista debe incluir cuatro datos de cada deuda: a quién le debes, cuánto, a qué interés y cuál es el pago mínimo.','Hay dos métodos populares. La «bola de nieve» paga primero la deuda más pequeña, para ganar motivación con victorias rápidas. La «avalancha» paga primero la que tiene el interés más alto, lo que ahorra más dinero. Ambos funcionan; lo importante es elegir uno y no adquirir nuevas deudas mientras tanto.'],
  steps:['Haz una lista de todas tus deudas con su monto, interés y pago mínimo.','Elige un método: bola de nieve (más motivación) o avalancha (más ahorro).','Paga el mínimo en todas y pon todo el dinero extra en la deuda elegida.'],
  exp:{who:'Dave Ramsey',bk:'La transformación total de su dinero',t:'Ramsey popularizó el método bola de nieve. Reconoce que matemáticamente la avalancha puede ahorrar más, pero sostiene que las finanzas personales son un 80% comportamiento y un 20% conocimiento: ver desaparecer una deuda pequeña te da el impulso para seguir con las grandes.'}},
 m7:{more:['Algunos ejemplos de activos: un negocio, una inversión, una propiedad que alquilas o un conocimiento que te permite ganar más. Algunos ejemplos de pasivos: deudas de consumo, un auto que pierde valor cada año o suscripciones que no usas.','Muchas personas compran pasivos creyendo que son activos. Por ejemplo, una casa demasiado grande o un auto nuevo con crédito parecen inversiones, pero cada mes cuestan dinero. La propuesta no es dejar de disfrutar, sino cambiar el orden: primero adquirir activos, y que esos activos paguen tus gustos.'],
  steps:['Haz una lista de tus principales bienes y gastos fijos.','Marca cuáles te dan dinero (activos) y cuáles te cuestan dinero (pasivos).','Define un primer activo que puedas empezar a construir este año.'],
  exp:{who:'Robert Kiyosaki',bk:'Padre rico, padre pobre',t:'Kiyosaki cuenta la historia de sus dos «padres»: su padre biológico, un profesor con buen sueldo que siempre tuvo problemas de dinero, y el padre de su mejor amigo, un empresario que construyó una fortuna. La diferencia, dice, es que uno trabajaba por dinero y el otro hacía que el dinero trabajara para él, comprando activos.'}},
 m8:{more:['El interés compuesto ocurre cuando las ganancias de una inversión generan nuevas ganancias. Al principio parece lento, pero con el tiempo se acelera como una bola de nieve que baja por una montaña. La regla del 72 lo hace fácil de calcular: divide 72 entre la tasa de interés anual y sabrás en cuántos años se duplica tu dinero. Al 8%, se duplica cada 9 años.','Un ejemplo lo muestra con claridad: una persona que invierte 100 dólares al mes desde los 25 años puede terminar con más dinero que otra que invierte el doble desde los 40. Por eso empezar pronto, aunque sea con poco, es la mejor decisión financiera que existe.'],
  steps:['Usa la regla del 72: divide 72 entre una tasa de interés y calcula en cuántos años se duplica tu dinero.','Busca una calculadora de interés compuesto en línea y prueba con tu propio ahorro mensual.','Investiga qué opciones de inversión a largo plazo existen en tu país.'],
  exp:{who:'Warren Buffett',bk:'Las cartas de Warren Buffett a los accionistas',t:'Buffett, uno de los inversores más exitosos de la historia, empezó a invertir a los 11 años. Más del 90% de su fortuna la ganó después de los 65 años, gracias al interés compuesto. Su consejo para la mayoría de las personas es invertir en fondos indexados de bajo costo y mantenerlos durante muchos años.'}},
 m9:{more:['Tus ingresos suelen ser un reflejo de dos cosas: cuánto valor aportas y a cuántas personas llega ese valor. Un médico que atiende a diez pacientes al día gana menos que uno que crea un método que ayuda a miles. No se trata de trabajar más horas, sino de resolver problemas más importantes o para más personas.','Esta mirada cambia la pregunta. En lugar de «¿cómo gano más?», te preguntas «¿qué problema puedo resolver mejor?». Las personas que prosperan de forma sostenida suelen enfocarse en servir bien, y el dinero llega como consecuencia.'],
  steps:['Escribe tres habilidades o conocimientos que tengas.','Para cada uno, piensa en un problema real que podría resolver para otras personas.','Elige uno y ofrécelo esta semana, aunque sea de forma gratuita, para validar su valor.'],
  exp:{who:'Ralph Waldo Emerson y Bob Burg',bk:'Dar para recibir (The Go-Giver)',t:'Emerson escribió en 1841 que en la vida todo tiende al equilibrio: lo que das, de alguna forma, vuelve. Siglos después, Bob Burg y John David Mann lo llevaron a los negocios en su fábula Dar para recibir: tu verdadero valor se mide por cuánto más das en valor de lo que recibes en pago.'}},
 m10:{more:['Cuando queremos cambiar, solemos pensar en grande: «voy a ahorrar la mitad de mi sueldo», «voy a invertir todos los meses». Pero los grandes propósitos se abandonan pronto. Los cambios duraderos empiezan tan pequeños que parece imposible fallar.','Un hábito tiene tres partes: una señal que lo dispara, la acción y una recompensa. Si quieres crear un hábito financiero, átalo a algo que ya haces: «después de tomar mi café, reviso mi saldo». Con el tiempo, la acción se vuelve automática y puedes hacerla más grande.'],
  steps:['Elige un micro-hábito financiero de menos de dos minutos.','Átalo a una rutina que ya tienes: «después de… voy a…».','Celebra cada vez que lo hagas, aunque sea con un gesto pequeño.'],
  exp:{who:'James Clear',bk:'Hábitos atómicos',t:'Clear explica que si mejoras un 1% cada día durante un año, terminas siendo unas 37 veces mejor. Propone cuatro leyes para crear hábitos: hazlo obvio, hazlo atractivo, hazlo sencillo y hazlo satisfactorio. Y recomienda enfocarse en el sistema, no en la meta: los ganadores y los perdedores suelen tener las mismas metas.'}},
 m11:{more:['Hay dos formas de ver nuestras capacidades. Con mentalidad fija, crees que el talento es algo con lo que naces: o lo tienes o no. Cada fracaso confirma que «no sirves». Con mentalidad de crecimiento, crees que las habilidades se desarrollan con esfuerzo y práctica. Cada fracaso es información sobre qué mejorar.','Casi todas las historias de éxito incluyen fracasos. Walt Disney fue despedido de un periódico por «falta de imaginación». Thomas Edison hizo miles de intentos antes de lograr una bombilla que funcionara. Lo que los diferenció no fue evitar el fracaso, sino aprender de él y seguir.'],
  steps:['Escribe un fracaso que todavía te pese.','Responde: ¿qué aprendí? ¿qué haría distinto? ¿qué habilidad necesito desarrollar?','Cambia «no puedo hacer esto» por «todavía no puedo hacer esto».'],
  exp:{who:'Carol Dweck',bk:'Mindset: la actitud del éxito',t:'La profesora de Stanford estudió durante décadas cómo enfrentan los desafíos niños, deportistas y empresarios. Descubrió que la palabra «todavía» tiene un gran poder: decir «todavía no lo logro» en lugar de «no puedo» mantiene abierta la puerta del aprendizaje. Y que elogiar el esfuerzo, más que el talento, fortalece la mentalidad de crecimiento.'}},
 m12:{more:['Toda inversión tiene riesgo. Si pones todo tu dinero en una sola opción y esa opción falla, lo pierdes todo. Diversificar es repartir tu dinero entre distintos tipos de inversión, sectores y países, para que si a uno le va mal, los demás compensen.','También es importante desconfiar de las promesas fáciles. Si alguien te ofrece ganancias altas, rápidas y seguras, probablemente es una estafa. Las inversiones serias tienen tres reglas: entiendes en qué pones tu dinero, sabes cuánto puedes perder y piensas a largo plazo.'],
  steps:['Escribe en qué tienes hoy tu dinero o tus ahorros.','Pregúntate: ¿si una de esas opciones fallara, cuánto perdería?','Investiga dos opciones de bajo riesgo en tu país, como fondos indexados o depósitos a plazo.'],
  exp:{who:'Benjamin Graham',bk:'El inversor inteligente',t:'Graham, maestro de Warren Buffett, propuso imaginar al mercado como «el señor Mercado», un socio emocional que cada día te ofrece precios distintos: a veces eufórico, a veces deprimido. El inversor inteligente no se deja llevar por su humor, diversifica y siempre deja un «margen de seguridad».'}},
 m13:{more:['A diferencia del dinero o de una propiedad, lo que sabes es el único activo que nadie te puede quitar y que crece cuando lo usas. Un curso, un libro o una nueva habilidad pueden aumentar tus ingresos durante toda tu vida. Por eso, invertir en aprender suele ser la inversión más rentable.','También vale la pena pensar en una segunda fuente de ingresos. No tiene que ser grande: dar clases, ofrecer un servicio o vender algo que sabes hacer. Además del dinero, te da seguridad: si una fuente falla, tienes otra.'],
  steps:['Elige una habilidad que podría aumentar tus ingresos en los próximos años.','Busca un recurso para aprenderla: un libro, un curso o un mentor.','Dedica 20 minutos al día durante esta semana a empezar.'],
  exp:{who:'Cal Newport',bk:'Tan bueno que no podrán ignorarte',t:'Newport, profesor de la Universidad de Georgetown, sostiene que seguir tu pasión no basta. Propone la «mentalidad de artesano»: desarrollar habilidades raras y valiosas con práctica deliberada. Esas habilidades se convierten en tu «capital profesional», que puedes intercambiar por más ingresos, libertad y propósito.'}},

 v1:{more:['Tu cuerpo tiene un reloj interno de unas 24 horas que regula el sueño, el hambre, la energía y el ánimo. Ese reloj se ajusta cada mañana con la luz. Cuando recibes luz natural al despertar, le dices a tu cuerpo «ya es de día»: sube tu energía, mejora tu humor y, unas 14 a 16 horas después, tu cuerpo libera melatonina para ayudarte a dormir.','El agua es el otro gesto clave. Durante la noche pierdes líquidos al respirar y transpirar, y una deshidratación leve ya afecta la concentración y el ánimo. Un vaso de agua al despertar es una forma sencilla de empezar el día con el cuerpo listo.'],
  steps:['Deja un vaso de agua junto a tu cama antes de dormir.','Al despertar, tómalo antes de revisar el celular.','Sal al exterior o asómate a una ventana durante 10 minutos con luz natural.'],
  exp:{who:'Andrew Huberman',bk:'Podcast Huberman Lab',t:'El neurocientífico de la Universidad de Stanford recomienda ver luz natural en los primeros 30 a 60 minutos del día, incluso si está nublado, porque la luz exterior es mucho más intensa que la de interiores. Según explica, este hábito ayuda a regular el ritmo circadiano, mejora el estado de alerta y facilita el sueño por la noche.'}},
 v2:{more:['Caminar es uno de los ejercicios más completos y subestimados. Fortalece el corazón, ayuda a controlar el azúcar en la sangre, mejora la digestión, reduce la ansiedad y estimula la creatividad. No requiere equipo, gimnasio ni entrenamiento previo.','La Organización Mundial de la Salud recomienda al menos 150 minutos de actividad moderada a la semana: unos 30 minutos, cinco días. Puedes dividirlo en caminatas cortas de 10 minutos. Lo importante es caminar a un ritmo en el que puedas hablar, pero no cantar.'],
  steps:['Elige un momento fijo del día para caminar: después de comer, al salir del trabajo o temprano.','Empieza con 10 minutos y sube poco a poco hasta 30.','Si puedes, camina con alguien: la compañía hace que sea más fácil sostenerlo.'],
  exp:{who:'Dan Buettner',bk:'El secreto de las zonas azules',t:'Buettner estudió las regiones del mundo donde más personas superan los 100 años, como Okinawa en Japón o Cerdeña en Italia. Descubrió que sus habitantes no van al gimnasio: se mueven de forma natural todo el día, caminando, cuidando sus huertos y subiendo cuestas.'}},
 v3:{more:['La comida real es la que reconocerían tus abuelos: frutas, verduras, legumbres, granos, huevos, carnes y pescados frescos. Los productos ultraprocesados, en cambio, están hechos en fábricas con ingredientes que no usarías en tu cocina: jarabes, aceites refinados, colorantes, saborizantes y conservantes.','El problema de los ultraprocesados es que están diseñados para que comas más: combinan azúcar, grasa y sal de forma que el cerebro pide más. Numerosos estudios los asocian con más riesgo de obesidad, diabetes y enfermedades del corazón. No necesitas eliminarlos todos de golpe: basta con ir reemplazándolos uno a uno.'],
  steps:['Revisa tu despensa y cuenta cuántos productos tienen más de cinco ingredientes.','Elige uno que consumas a diario y busca una alternativa natural.','Cuando hagas compras, recorre primero los pasillos de frutas, verduras y alimentos frescos.'],
  exp:{who:'Michael Pollan',bk:'El detective en el supermercado',t:'El periodista resume décadas de investigación en una regla de siete palabras: «come comida, no demasiada, sobre todo plantas». Y agrega consejos prácticos: no comas nada que tu bisabuela no reconocería como comida, y evita productos con ingredientes que no puedas pronunciar.'}},
 v4:{more:['El sueño no empieza cuando apagas la luz: empieza al despertar. La luz de la mañana, el movimiento durante el día, los horarios regulares y lo que comes y bebes influyen en cómo duermes por la noche. Dormir mal no es solo cansancio: afecta la memoria, el ánimo, el peso y las defensas.','La mayoría de los adultos necesita entre 7 y 9 horas de sueño. Algunas claves: mantener el mismo horario todos los días, incluso el fin de semana; evitar la cafeína después del mediodía, porque permanece en el cuerpo muchas horas; y mantener la habitación fresca, oscura y silenciosa.'],
  steps:['Elige una hora fija para acostarte y otra para levantarte, y respétalas todos los días.','Toma tu último café antes de las 12 del día.','Baja la luz de tu casa una hora antes de dormir.'],
  exp:{who:'Matthew Walker',bk:'Por qué dormimos',t:'El neurocientífico de la Universidad de California explica que el sueño es la base de la salud, más que la alimentación o el ejercicio. Mientras dormimos, el cerebro consolida lo aprendido y elimina desechos. Su consejo número uno es mantener un horario regular, porque el cuerpo funciona mejor con rutina.'}},
 v5:{more:['Cuando estás estresado, respiras rápido y corto, con el pecho. Eso le dice a tu cuerpo que hay peligro y mantiene la alerta encendida. Cuando respiras lento y profundo, con el abdomen, ocurre lo contrario: tu cuerpo entiende que está a salvo y activa la calma.','La clave está en la exhalación. Exhalar más lento de lo que inhalas baja el ritmo cardíaco en pocos minutos. Una técnica sencilla es la respiración 4-6: inhala en cuatro tiempos y exhala en seis. Otra es el «suspiro fisiológico»: dos inhalaciones seguidas por la nariz y una exhalación larga por la boca.'],
  steps:['Pon tres alarmas al día para practicar dos minutos de respiración 4-6.','Cuando sientas estrés, prueba el suspiro fisiológico: dos inhalaciones y una exhalación larga.','Antes de dormir, respira lento durante cinco minutos con una mano en el abdomen.'],
  exp:{who:'James Nestor',bk:'Respira',t:'Nestor recorrió laboratorios y tradiciones antiguas para entender la respiración. Concluyó que la mayoría respira de forma incorrecta: demasiado rápido y por la boca. Recomienda respirar por la nariz, más lento y más profundo, y menciona un ritmo de unas seis respiraciones por minuto como uno de los más equilibrados para el cuerpo.'}},
 v6:{more:['Esta guía funciona como un mapa visual. Las verduras y frutas aportan fibra, vitaminas y antioxidantes. Un cuarto con proteína (legumbres, pescado, pollo, huevos) te da saciedad y fuerza. El último cuarto con granos enteros (arroz integral, quinua, avena) te da energía estable.','No necesitas contar calorías ni seguir dietas estrictas. Si llenas la mitad del plato con plantas, de forma natural comes menos de lo que te hace daño y más de lo que te nutre. Además, la fibra de las plantas alimenta a las bacterias buenas de tu intestino, que influyen en tu digestión, tus defensas y hasta tu ánimo.'],
  steps:['En tu próxima comida, llena primero la mitad del plato con verduras.','Agrega una porción de proteína del tamaño de la palma de tu mano.','Completa con un puñado de granos enteros, y acompaña con agua.'],
  exp:{who:'Walter Willett (Universidad de Harvard)',bk:'Eat, Drink, and Be Healthy',t:'Willett, uno de los investigadores en nutrición más citados del mundo, creó junto a su equipo de Harvard el «plato para comer saludable». Su investigación muestra que la calidad de lo que comemos importa más que la cantidad de grasa o carbohidratos, y que las dietas ricas en plantas se asocian con una vida más larga.'}},
 v7:{more:['A partir de los 30 años perdemos poco a poco masa muscular, y la pérdida se acelera después de los 50. Esto no es solo estético: los músculos protegen los huesos, regulan el azúcar en la sangre, mantienen el equilibrio y nos permiten ser independientes en la vejez.','La buena noticia es que el músculo responde al entrenamiento a cualquier edad. No necesitas un gimnasio: el peso de tu propio cuerpo, cargar las bolsas de las compras o subir escaleras ya son entrenamiento de fuerza. Lo importante es hacerlo al menos dos veces por semana y aumentar el esfuerzo poco a poco.'],
  steps:['Elige dos días fijos de la semana para entrenar fuerza.','Haz 3 series de 10 sentadillas y 10 flexiones adaptadas a tu nivel.','Cada semana, agrega una o dos repeticiones más.'],
  exp:{who:'Peter Attia',bk:'Outlive',t:'El médico especialista en longevidad sostiene que la fuerza muscular es uno de los mejores predictores de cuántos años y con qué calidad viviremos. Propone entrenar hoy pensando en el «decatlón del centenario»: las actividades que quieres seguir haciendo a los 90 años, como cargar a un nieto o subir escaleras.'}},
 v8:{more:['Hoy comemos rápido, de pie, frente a una pantalla o pensando en otra cosa. Así, el cerebro no registra bien lo que comimos y pedimos más de lo que necesitamos. Si comes en cinco minutos, terminas mucho antes de que llegue la señal de saciedad.','Comer con atención significa comer sin distracciones, despacio, notando los sabores, las texturas y las señales de tu cuerpo. Mejora la digestión, ayuda a comer la cantidad justa y convierte cada comida en una pausa de calma en medio del día.'],
  steps:['Haz al menos una comida al día sin pantallas.','Deja los cubiertos sobre la mesa entre cada bocado.','Antes de servirte otra porción, espera cinco minutos y pregúntate si de verdad tienes hambre.'],
  exp:{who:'Thich Nhat Hanh y Lilian Cheung (Universidad de Harvard)',bk:'Saborear',t:'Un maestro de meditación y una nutricionista de Harvard escribieron juntos este libro sobre comer con atención plena. Proponen tratar cada comida como un momento de presencia: mirar el alimento, agradecer, masticar despacio y notar cuándo el cuerpo ya está satisfecho.'}},
 v9:{more:['La luz de las pantallas, especialmente la azul, engaña a tu cerebro haciéndole creer que todavía es de día. Esto retrasa la liberación de melatonina, la hormona que te prepara para dormir. Además, el contenido que vemos (noticias, redes, mensajes de trabajo) mantiene la mente activa y alerta.','Algunas alternativas para esa última hora: leer un libro en papel, conversar, estirarte, tomar una infusión o escribir en un diario. Dejar el celular fuera de la habitación es uno de los cambios más simples y efectivos para dormir mejor.'],
  steps:['Elige una hora límite para usar pantallas, al menos 60 minutos antes de dormir.','Deja el celular cargando fuera de tu habitación y usa un despertador común.','Reemplaza ese tiempo con una actividad relajante: leer, estirarte o conversar.'],
  exp:{who:'Matthew Walker',bk:'Por qué dormimos',t:'Walker cita estudios en los que leer en una tableta antes de dormir redujo la liberación de melatonina y retrasó el sueño en comparación con leer un libro en papel. Recomienda crear una rutina de «aterrizaje» de al menos una hora antes de acostarse, con luces bajas y sin pantallas.'}},
 v10:{more:['El azúcar no solo está en los dulces. Está escondido en bebidas, salsas, panes, cereales, yogures y hasta en productos que se venden como «saludables». En las etiquetas aparece con muchos nombres: jarabe de maíz, dextrosa, maltosa, sacarosa o jugo concentrado.','Comer mucha azúcar provoca subidas y bajadas de energía a lo largo del día, aumenta los antojos y, con el tiempo, el riesgo de diabetes y enfermedades del corazón. La OMS recomienda no superar unas seis cucharaditas de azúcar agregado al día. Una sola lata de refresco puede tener casi el doble.'],
  steps:['Lee las etiquetas de cinco productos que compras siempre y busca el azúcar agregado.','Reemplaza una bebida azucarada al día por agua, agua con limón o infusión.','Si quieres algo dulce, elige fruta entera.'],
  exp:{who:'Robert Lustig',bk:'Fat Chance',t:'El endocrinólogo pediatra de la Universidad de California fue uno de los primeros en alertar sobre los efectos del azúcar agregado en la salud. Explica que la fruta entera es distinta al azúcar de los productos procesados, porque su fibra hace que el cuerpo la absorba más despacio.'}},
 v11:{more:['Pasar muchas horas sentado tiene efectos propios en la salud, incluso en personas que hacen ejercicio. Cuando estás quieto mucho tiempo, la circulación se vuelve más lenta, los músculos se desactivan y el cuerpo procesa peor el azúcar y las grasas.','La solución es sencilla: interrumpir el tiempo sentado. Levantarte unos minutos cada 30 a 60 minutos, estirarte, caminar por la casa o subir unas escaleras reactiva el cuerpo y mejora la concentración. Son pequeños movimientos que suman mucho a lo largo del día.'],
  steps:['Pon una alarma cada hora mientras trabajas o estudias.','Cuando suene, levántate dos minutos: camina, estírate o sube escaleras.','Haz tus llamadas de pie o caminando siempre que puedas.'],
  exp:{who:'James Levine (Clínica Mayo)',bk:'Get Up! (¡Levántate!)',t:'El médico e investigador de la Clínica Mayo estudió el gasto de energía de las actividades cotidianas, al que llamó NEAT. Descubrió que las personas delgadas pasan, en promedio, más de dos horas al día más de pie o en movimiento que las personas con obesidad, sin hacer ejercicio formal.'}},
 v12:{more:['El ser humano vivió en contacto con la naturaleza durante casi toda su historia. Hoy pasamos la mayor parte del tiempo bajo techo y frente a pantallas. Las investigaciones muestran que volver a la naturaleza, aunque sea un rato, tiene efectos medibles en el cuerpo.','En Japón se estudia desde los años ochenta el «baño de bosque»: pasear despacio entre árboles, usando los cinco sentidos. Los estudios encontraron que reduce el cortisol, la hormona del estrés, baja la presión arterial y mejora el ánimo. Algunos árboles liberan sustancias que, al respirarlas, fortalecen las defensas.'],
  steps:['Elige un espacio natural cerca de ti: un parque, un jardín o una zona con árboles.','Visítalo al menos 20 minutos esta semana, sin el celular en la mano.','Camina despacio y presta atención a lo que ves, escuchas, hueles y tocas.'],
  exp:{who:'Qing Li (Escuela de Medicina de Nippon, Tokio)',bk:'Shinrin-yoku: el arte japonés de los baños de bosque',t:'Li es uno de los principales investigadores del baño de bosque. Sus estudios mostraron que pasar tiempo entre árboles aumenta la actividad de las células que defienden al cuerpo, y que el efecto puede durar varios días. Recomienda unas dos horas al mes como mínimo.'}},
 v13:{more:['Solemos pensar en la salud como alimentación, ejercicio y sueño. Pero las relaciones son igual de importantes. La soledad prolongada eleva el estrés, debilita las defensas y aumenta el riesgo de enfermedades del corazón tanto como fumar.','No se trata de tener muchos amigos, sino de tener vínculos de calidad: personas con quienes puedes hablar con confianza, que te apoyan y a quienes apoyas. Esas relaciones necesitan cuidado, como un jardín: llamadas, visitas, tiempo compartido y gestos de cariño.'],
  steps:['Haz una lista de cinco personas importantes para ti.','Esta semana, llama o visita a una con quien no hablas hace tiempo.','Agenda un encuentro mensual fijo con alguien que te haga bien.'],
  exp:{who:'Robert Waldinger (Universidad de Harvard)',bk:'Una buena vida',t:'Waldinger dirige el Estudio de Harvard sobre el Desarrollo Adulto, que sigue a cientos de personas desde 1938. Su conclusión, compartida en una de las charlas TED más vistas: las buenas relaciones nos mantienen más felices y más sanos. Las personas más satisfechas con sus vínculos a los 50 años eran las más sanas a los 80.'}}

/* Reparte las 3 cápsulas de la semana entre los días elegidos */
function capDays(){
  var av=(S.diag&&S.diag.avail)||{lun:30,mie:30,vie:30};
  var sel=DAYS.filter(function(d){return av[d.k]!=null;});
  if(!sel.length) sel=[DAYS[0],DAYS[2],DAYS[4]];
  var n=sel.length, idx = n>=3 ? [0,Math.floor((n-1)/2),n-1] : (n===2?[0,1,1]:[0,0,0]);
  return idx.map(function(i){ var nm=sel[i].n; return nm.charAt(0).toUpperCase()+nm.slice(1); });
}
function dayFor(p){ return capDays()[{s:0,m:1,v:2}[p]]; }

/* ================= ORBE DEL MENTOR ================= */
var orbState={speed:1}, orbCanvases=[];
function makeOrb(){
  var wrap=document.createElement('div'); wrap.className='orb';
  var c=document.createElement('canvas'); wrap.appendChild(c); orbCanvases.push(c);
  var w=document.createElement('div'); w.appendChild(wrap); var sh=document.createElement('div'); sh.className='orb-shadow'; w.appendChild(sh);
  return w;
}
var ot=0;
function tok(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function drawOrbs(){
  ot+=0.016*orbState.speed;
  orbCanvases=orbCanvases.filter(function(c){return c.isConnected;});
  var a=tok('--accent'), cols=[tok('--spirit'),tok('--matter'),tok('--vital')];
  orbCanvases.forEach(function(c){
    var d=Math.min(window.devicePixelRatio||1,2), W=c.clientWidth, H=c.clientHeight; if(!W) return;
    if(c.width!==W*d){c.width=W*d;c.height=H*d;}
    var x=c.getContext('2d'); x.setTransform(d,0,0,d,0,0); x.clearRect(0,0,W,H);
    var cx=W/2, cy=H/2, R=W*.46, breathe=1+.04*Math.sin(ot*1.4);
    var g=x.createRadialGradient(cx,cy,0,cx,cy,R*breathe); g.addColorStop(0,a); g.addColorStop(1,'transparent');
    x.globalAlpha=.16; x.fillStyle=g; x.beginPath(); x.arc(cx,cy,R*breathe,0,7); x.fill();
    x.globalAlpha=.9; x.strokeStyle=a; x.lineWidth=1.6; x.beginPath();
    var turns=3.2, b=Math.log((R*.9)/2)/(turns*2*Math.PI), rot=ot*.9;
    for(var t=0;t<=turns*2*Math.PI;t+=.05){var r=2*Math.exp(b*t)*breathe;var px=cx+r*Math.cos(t+rot),py=cy+r*Math.sin(t+rot);t?x.lineTo(px,py):x.moveTo(px,py);} x.stroke();
    for(var k=1;k<=Math.floor(turns*3);k++){var t2=k*2*Math.PI/3,r2=2*Math.exp(b*t2)*breathe;x.fillStyle=cols[(k-1)%3];x.globalAlpha=.95;x.beginPath();x.arc(cx+r2*Math.cos(t2+rot),cy+r2*Math.sin(t2+rot),1.4+k*.32,0,7);x.fill();}
    x.globalAlpha=1;
  });
  if(!reduce) requestAnimationFrame(drawOrbs);
}

/* ================= ESCRITURA ================= */
var typingJob=null;
function typeText(el,text,speed,done){
  /* El texto completo se coloca desde el inicio (la parte pendiente invisible), así cada letra aparece en su lugar final y nada se mueve. */
  if(typingJob) typingJob.cancel();
  speed=Math.round(speed*1.8);
  el.innerHTML='';
  var shown=document.createElement('span'), caret=document.createElement('span'), rest=document.createElement('span');
  caret.className='caret'; rest.className='ghost'; rest.textContent=text;
  el.appendChild(shown); el.appendChild(caret); el.appendChild(rest);
  var i=0, timer=null, finished=false;
  orbState.speed=3.5;
  function finish(){ if(finished) return; finished=true; clearTimeout(timer); shown.textContent=text; rest.textContent=''; caret.remove(); orbState.speed=1; el.onclick=null; typingJob=null; done&&done(); }
  function step(){ i++; shown.textContent=text.slice(0,i); rest.textContent=text.slice(i); if(i<text.length){ var ch=text[i-1]; timer=setTimeout(step, /[.?!]/.test(ch)?speed*9:(ch===','||ch===':'?speed*4:speed)); } else finish(); }
  el.onclick=finish;
  typingJob={cancel:function(){ finished=true; clearTimeout(timer); orbState.speed=1; }};
  if(reduce) finish(); else timer=setTimeout(step,300);
}
/* Escribe la pregunta y luego la indicación, una tras otra */
function typeQA(q,qt,hint,ht,done){
  hint.innerHTML=ht?'<span class="ghost">'+esc(up(ht))+'</span>':'';
  typeText(q,qt,34,function(){
    if(!ht){ done&&done(); return; }
    setTimeout(function(){ typeText(hint,up(ht),16,done); }, reduce?0:350);
  });
}

function botScreen(opts){

  root.innerHTML='';

  el.innerHTML='<div class="bot-bg"></div>'+
   '<div class="bot-top gutter"><div class="brand">'+logo(22)+'Áurea</div><span class="mono phase">'+esc(opts.phase)+'</span></div>'+
   '<div class="bot-main gutter"><div class="orb-slot"></div><h1 class="q" id="q" aria-live="polite"></h1><p class="hint" id="hint"></p><div class="answer wait" id="answer"></div><p class="tap" id="tap">Toca el texto para mostrarlo completo</p></div>'+
   '<div class="bot-foot gutter"><button class="btn btn-ghost" id="back" type="button">← Anterior</button><div class="dots" id="dots"></div><button class="btn btn-primary" id="next" type="button">Siguiente</button></div>';

}

    } else if(st.type==='password'){

      rules.innerHTML=RULES.map(function(r){return '<li data-r="'+r[0]+'">'+r[1]+'</li>';}).join('');

      ans.appendChild(pw); ans.appendChild(rules); value=''; setVal('');
    } else if(st.type==='options'||st.type==='cards'){

    } else if(st.type==='schedule'){

function orderPillar(p,ch){
  var chs=Array.isArray(ch)?ch:(ch?[ch]:[]);
  var list=CAPS.filter(function(c){return c.p===p;});
  var first=list[0]; // primera cápsula fija por pilar
  function score(c){ return chs.filter(function(x){return c.t.indexOf(x)>=0;}).length; }
  // una cápsula afín por cada reto elegido, en el orden en que se eligieron
  var picks=[];
  chs.forEach(function(x){ var m=list.filter(function(c){return c.t.indexOf(x)>=0 && picks.indexOf(c)<0;})[0]; if(m) picks.push(m); });
  var head=picks.length?[picks[0]].concat(picks[0]===first?[]:[first],picks.slice(1)):[first];
  head=head.filter(function(c,k){return head.indexOf(c)===k;});
  var rest=list.filter(function(c){return head.indexOf(c)<0;});
  rest.sort(function(a,b){ return score(b)-score(a); });
  return head.concat(rest).map(function(c){return c.id;});
}
function buildRoute(){
  var d=S.diag, weeks=WEEKS[d.months]||13;
  if(d['w_'+AREAS[0].k]!=null){ applyWheel(d,wheelFrom(d)); d.wheelAt=Date.now()+S.dayOffset*86400000; }
  var s=orderPillar('s',d.sCh), m=orderPillar('m',d.mCh), v=orderPillar('v',d.vCh);
  var route=[];
  for(var w=0;w<weeks;w++){ route.push(w<13?[s[w],m[w],v[w]]:null); }
  S.route=route; S.stage='building'; save();
  buildingScreen();
}

  });
