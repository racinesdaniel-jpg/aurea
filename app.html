<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="firebase-config.js"></script>
<style>html,body{margin:0;padding:0;height:100%}#root{height:100%}</style>
</head>
<body>
<title>Áurea App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: el bot ocupa la pantalla como una presencia serena (orbe-espiral al centro, una pregunta a la vez); la app es una línea de tiempo vertical que sube vuelta a vuelta. */
:root{
  --bg:#F7F5F0; --bg-2:#EEEAE2; --surface:#FFFFFF; --line:#E3DED4;
  --fg:#141A2E; --muted:#5D6378; --accent:#0E8C78; --accent-fg:#FFFFFF; --accent-soft:#0E8C781A;
  --spirit:#6E4FE8; --matter:#D48C0E; --vital:#EA5A45; --danger:#C2412D;
  --ink:#111833; --ink-2:#1B2450; --glow:#2BD4B4;
  --grad:linear-gradient(135deg,#111833 0%,#24206B 48%,#0E6F68 100%);
  --shadow:0 1px 2px rgba(20,26,46,.05),0 12px 32px -14px rgba(20,26,46,.18);
  --f-display:"Newsreader","Iowan Old Style",Georgia,serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Hanken Grotesk",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0F1E;--bg-2:#121831;--surface:#151C35;--line:#252E4D;--fg:#EEF0F7;--muted:#9AA2BC;
  --accent:#2FD3B3;--accent-fg:#06221D;--accent-soft:#2FD3B31F;--spirit:#A08BFF;--matter:#F4B848;--vital:#FF8370;--danger:#FF8A78;
  --ink:#0E1430;--ink-2:#19214A;--grad:linear-gradient(135deg,#0E1430 0%,#2A2272 50%,#0C6A63 100%);--shadow:0 12px 32px -16px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F1E;--bg-2:#121831;--surface:#151C35;--line:#252E4D;--fg:#EEF0F7;--muted:#9AA2BC;
  --accent:#2FD3B3;--accent-fg:#06221D;--accent-soft:#2FD3B31F;--spirit:#A08BFF;--matter:#F4B848;--vital:#FF8370;--danger:#FF8A78;
  --ink:#0E1430;--ink-2:#19214A;--grad:linear-gradient(135deg,#0E1430 0%,#2A2272 50%,#0C6A63 100%);--shadow:0 12px 32px -16px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--bg)}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;font-weight:600;padding:.85em 1.5em;border-radius:999px;border:1px solid transparent;cursor:pointer;transition:transform .15s,opacity .15s,background .2s}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-primary:hover:not(:disabled){transform:translateY(-1px)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.mono{font-family:var(--f-mono);letter-spacing:.12em;text-transform:uppercase;font-size:.75rem}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.d-s{--c:var(--spirit)}.d-m{--c:var(--matter)}.d-v{--c:var(--vital)}

/* ===== BOT ===== */
.bot{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.bot-top,.bot-foot{flex:none}
/* El contenido se desplaza por dentro; los botones quedan siempre visibles abajo */
.bot .bot-main{min-height:0;overflow-y:auto;justify-content:safe center}
.bot-main>*{flex-shrink:0}
[hidden]{display:none!important}
@media (max-height:860px){
  .bot-top{padding-block:10px}
  .bot .bot-main{gap:12px;padding-block:4px 10px}
  .orb{width:76px;height:76px}.bot.compact .orb{width:56px;height:56px}
  .q{font-size:clamp(1.3rem,3.2vw,2.1rem);min-height:0}
  .bot.compact .q{font-size:clamp(1.2rem,2.8vw,1.8rem)}
  .hint{font-size:.85rem}.tap{display:none}
  .bot-foot{padding-block:10px max(12px,env(safe-area-inset-bottom,0px))}
  .dbtn{padding:.55em 0}.stp b{font-size:1.15rem}
}
@media (max-height:640px){.orb-slot{display:none}}
.bot-bg{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(600px 400px at 50% 22%,var(--accent-soft),transparent 70%),
  radial-gradient(500px 360px at 85% 100%,color-mix(in srgb,var(--spirit) 10%,transparent),transparent 70%)}
.bot-top{position:relative;display:flex;justify-content:space-between;align-items:center;padding-block:18px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:1.25rem}
.brand svg{color:var(--accent)}
.phase{color:var(--muted)}
.bot-main{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-block:12px 24px;max-width:860px;width:100%;margin:0 auto;text-align:center}
.orb{width:112px;height:112px;position:relative;flex:none}
.orb canvas{width:100%;height:100%;display:block}
.orb-shadow{width:90px;height:10px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 30%,transparent),transparent);margin:-8px auto 0}
.q{font-family:var(--f-display);font-weight:300;font-size:clamp(1.5rem,4.2vw,2.6rem);line-height:1.2;text-transform:uppercase;letter-spacing:.01em;min-height:2.4em;max-width:24ch;cursor:pointer}
.q em{font-style:italic;color:var(--accent)}
.caret{display:inline;border-left:2px solid var(--accent);margin-left:-1px;margin-right:-1px;animation:blinkb 1s steps(1) infinite}
@keyframes blinkb{50%{border-left-color:transparent}}
.ghost{visibility:hidden}
.q,.hint,.paytext{text-wrap:wrap}
#q.plain{text-transform:none;letter-spacing:0;font-weight:300;max-width:26ch;font-size:clamp(1.4rem,3vw,2rem);line-height:1.3}
@keyframes blink{50%{opacity:0}}
.hint{color:var(--muted);font-size:.92rem;letter-spacing:.06em;text-transform:uppercase;max-width:56ch;min-height:1.5em;line-height:1.6;cursor:pointer}
.tap{color:var(--muted);font-size:.78rem}
.answer{width:100%;max-width:640px;transition:opacity .4s,transform .4s}
.answer.wait{opacity:0;transform:translateY(10px);pointer-events:none}
.field{width:100%;font-family:var(--f-display);font-size:clamp(1.4rem,3.6vw,2rem);text-align:center;text-transform:uppercase;background:transparent;border:0;border-bottom:2px solid var(--line);color:var(--fg);padding:.4em .2em;outline:none;border-radius:0}
.field:focus{border-bottom-color:var(--accent)}
.field::placeholder{color:color-mix(in srgb,var(--muted) 60%,transparent)}
.err{color:var(--danger);font-size:.9rem;margin-top:10px;min-height:1.4em;text-transform:uppercase;font-family:var(--f-mono);letter-spacing:.06em}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.opt{padding:.8em 1.3em;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;text-align:left;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.opt small{display:block;color:inherit;opacity:.7;font-weight:400;font-size:.82rem}
.opts.cards{display:grid;grid-template-columns:repeat(3,1fr)}
.opts.cards .opt{padding:1.1em;text-align:center}
.opts.multi .opt{display:inline-flex;align-items:center;gap:.6em}
.opts.multi .opt::before{content:'';flex:none;width:1.1em;height:1.1em;border-radius:5px;border:1.5px solid currentColor;opacity:.5;box-sizing:border-box;display:grid;place-items:center;font-size:.85em;line-height:1;font-weight:700}
.opts.multi .opt[aria-pressed="true"]::before{content:'✓';opacity:1;border-color:var(--accent-fg);background:var(--accent-fg);color:var(--accent)}
.opts.cards .opt b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.7rem}
@media (max-width:560px){.opts.cards{grid-template-columns:1fr}}
.sched{display:grid;gap:14px;width:100%;max-width:640px;margin:0 auto}
.wpick{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.dcol{display:grid;gap:6px;justify-items:stretch}
.dbtn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:.75em 0;cursor:pointer;display:grid;gap:2px;transition:background .2s,border-color .2s,color .2s}
.dbtn .dl{font-weight:600;font-size:.95rem}
.dbtn .ds{display:none}
.dbtn:hover{border-color:var(--accent)}
.dbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.stp{display:grid;grid-template-rows:auto auto auto auto;justify-items:center;border:1px solid var(--line);border-radius:14px;padding:4px 0;background:color-mix(in srgb,var(--surface) 70%,transparent);opacity:.35;transition:opacity .2s}
.dcol.on .stp{opacity:1;border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.stp button{border:0;background:none;width:100%;padding:.25em 0;font-size:1.15rem;line-height:1;cursor:pointer;color:var(--accent)}
.stp b{font-family:var(--f-display);font-weight:400;font-size:1.35rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stp small{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sched-sum{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:.92rem;color:var(--muted);min-height:1.6em}
.sched-sum b{color:var(--accent);font-weight:600}
@media (max-width:520px){.wpick{gap:4px}.dbtn .dl{display:none}.dbtn .ds{display:block;font-weight:600}.stp b{font-size:1.05rem}.stp small{font-size:.56rem;letter-spacing:.04em}}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.scale .opt{padding:.7em 0;text-align:center;border-radius:10px;font-variant-numeric:tabular-nums}
.scale-legend{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;margin-top:8px}
@media (max-width:460px){.scale{grid-template-columns:repeat(5,1fr)}}
.bot-foot{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:16px max(20px,env(safe-area-inset-bottom,0px));max-width:860px;width:100%;margin:0 auto}
.dots{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.dots .bar{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--accent);width:34px}
.dots i.done{background:color-mix(in srgb,var(--accent) 50%,var(--line))}
.dots span{color:var(--muted);font-size:.82rem}
.dots .bar{flex-wrap:nowrap}
@media (max-width:520px){.dots i{width:10px}.dots i.on{width:18px}.dots i.done{width:10px}.bot-foot{gap:8px}.bot-foot .btn{padding:.75em 1.05em;font-size:.92rem;white-space:nowrap}}
@media (max-width:420px){.dots .bar{display:none}}
.summary{width:100%;max-width:520px;margin-inline:auto;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:6px 20px}
.summary div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.summary div:last-child{border-bottom:0}
.summary span{color:var(--muted);font-size:.7rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.summary b{font-family:var(--f-display);font-weight:400;font-size:1.12rem;text-align:right;overflow-wrap:anywhere}
.bot.compact .orb{width:72px;height:72px}
.bot.compact .bot-main{gap:14px;max-width:980px}
.bot.compact .q{font-size:clamp(1.4rem,3.4vw,2.2rem);min-height:0}
.bot.compact .answer{max-width:none}
.reg-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%;margin:6px auto 0;text-align:left}
@media (max-width:760px){.reg-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
.rcard{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:color-mix(in srgb,var(--surface) 82%,transparent);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;min-width:0;transition:border-color .2s,transform .2s,box-shadow .2s;animation:rise .5s ease both;animation-delay:calc(var(--k)*70ms)}
.rcard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 14px 30px -20px color-mix(in srgb,var(--accent) 60%,transparent)}
.rcard .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.rcard .tx{min-width:0;display:grid;gap:2px;text-align:left}
.rcard .tx span{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.rcard .tx b{font-family:var(--f-display);font-weight:400;font-size:1.22rem;line-height:1.2;text-transform:uppercase;overflow-wrap:anywhere}
.rcard .ed{color:var(--muted);opacity:.55;transition:opacity .2s}
.rcard:hover .ed{opacity:1;color:var(--accent)}
.rcard.wide{grid-column:span 2}
@media (max-width:760px){.rcard{grid-template-columns:auto 1fr;padding:12px}.rcard .ed{position:absolute;top:10px;right:10px}.rcard .ic{width:32px;height:32px}.rcard .tx b{font-size:1.05rem}}
@media (max-width:420px){.rcard .tx b{font-size:.98rem}}
.big-cta{font-size:1.05rem;padding:1em 2.6em;letter-spacing:.08em;text-transform:uppercase}
.scores{width:100%;max-width:520px;margin-inline:auto;display:grid;gap:12px;text-align:left}
.intro-grid{display:grid;gap:18px;width:100%;max-width:520px;margin-inline:auto;align-items:center}
.intro-grid .summary{padding:4px 18px}
.intro-grid .summary div{padding:9px 0}
.sum-h{margin:10px 0 2px;font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
@media (min-width:820px){.intro-grid{grid-template-columns:1fr 1fr;max-width:900px;gap:36px}}
.score{display:grid;grid-template-columns:110px 1fr 36px;gap:12px;align-items:center;font-size:.92rem}
.score .track{height:8px;border-radius:4px;background:var(--bg-2);overflow:hidden}
.score .track i{display:block;height:100%;background:var(--c);border-radius:4px;transition:width 1.2s ease}
.score b{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.building{display:flex;flex-direction:column;gap:8px;font-family:var(--f-mono);font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.building .ok{color:var(--accent)}

/* ===== APP ===== */
.app{min-height:100%;display:flex;flex-direction:column}
.app-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.app-top .row{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:.35em .8em;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.8rem;white-space:nowrap}
.chip.trial{border-color:var(--accent);color:var(--accent)}
.tabs{max-width:1000px;margin:0 auto;display:flex;gap:4px}
.tabs button{background:none;border:0;padding:10px 14px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.app-main{max-width:1000px;width:100%;margin:0 auto;padding-block:28px 64px;display:grid;gap:28px}
.hello h1{font-size:clamp(1.8rem,4.6vw,2.8rem);line-height:1.1}
.hello p{color:var(--muted);margin-top:8px}
.current{border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:clamp(18px,3vw,28px);display:grid;gap:18px}
.current-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.current-head h2{font-size:1.6rem}
.cap-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:760px){.cap-row{grid-template-columns:1fr}}
.cap-card{position:relative;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .15s,transform .15s}
.cap-card:hover:not([disabled]){border-color:var(--c);transform:translateY(-2px)}
.cap-card[disabled]{cursor:default;opacity:.55}
.cap-card .k{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.cap-card h3{font-size:1.2rem;line-height:1.25}
.cap-card .st{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.cap-card.done{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.cap-card.done .st{color:var(--c)}
.pbar{height:6px;border-radius:3px;background:var(--bg-2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .6s}
.timeline{position:relative;display:grid;gap:10px}
.timeline h2{font-size:1.5rem;margin-bottom:6px}
.wk{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start}
.node{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:.8rem;position:relative}
.wk:not(:last-child) .node::after{content:"";position:absolute;top:44px;left:50%;width:1px;height:calc(100% + 10px);background:var(--line);transform:translateX(-50%)}
.wk.is-done .node{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.wk.is-now .node{border:2px solid var(--accent);color:var(--accent);font-weight:600}
.wk-body{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);min-width:0}
.wk.is-lock .wk-body{background:transparent;border-style:dashed}
.wk-title{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.wk-title b{color:var(--fg);font-weight:600}
.wk-caps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:760px){.wk-caps{grid-template-columns:1fr}}
.mini{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;text-align:left;background:none;border:0;padding:4px 0;cursor:pointer;min-width:0}
.mini[disabled]{cursor:default;color:var(--muted)}
.mini i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;margin-top:.5em}
.mini.done span{text-decoration:line-through;text-decoration-color:var(--c)}
.more{color:var(--muted);font-size:.9rem;text-align:center;padding:10px}
.panel{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:clamp(18px,3vw,28px);display:grid;gap:16px}
.panel h2{font-size:1.5rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg)}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}
@media (max-width:520px){.stats{grid-template-columns:1fr}}
.ladder{display:grid;gap:8px}
.lv{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:10px 14px;border-radius:12px;border:1px solid var(--line)}
.lv .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.1em;width:70px}
.lv b{font-family:var(--f-display);font-weight:400;font-size:1.2rem}
.lv small{color:var(--muted)}
.lv.reached{background:var(--accent-soft)}
.lv.cur{border-color:var(--accent);border-width:2px}

.ad-act{justify-content:space-between;border-top:1px solid var(--line);padding-top:14px}

/* ===== Rueda de la vida ===== */
.radar{width:100%;height:auto;display:block;overflow:visible}
.rd-ring{fill:none;stroke:var(--line);stroke-width:1}
.rd-ring:last-of-type{stroke:color-mix(in srgb,var(--muted) 40%,var(--line))}
.rd-ax{stroke:var(--line);stroke-width:1}

.rd-a{fill:color-mix(in srgb,var(--spirit) 20%,transparent);stroke:var(--spirit)}
.rd-b{fill:color-mix(in srgb,var(--accent) 24%,transparent);stroke:var(--accent)}
.rd-ghost{fill:none;stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1.5}

.rd-dot.d-s{fill:var(--spirit)}.rd-dot.d-m{fill:var(--matter)}.rd-dot.d-v{fill:var(--vital)}

.rd-n{font-weight:600}.rd-n.d-s{fill:var(--spirit)}.rd-n.d-m{fill:var(--matter)}.rd-n.d-v{fill:var(--vital)}
.rd-v{font-weight:700;fill:var(--fg)}
.intro-radar{width:100%;max-width:420px;margin-inline:auto;text-align:center}

@media (max-width:819px){.intro-radar .radar{max-height:32vh}}
.pg-radar{max-width:420px;margin:0 auto;width:100%}
.wheel-card{gap:18px}
.wc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.wc-h h2{margin:0}.wc-h p{margin:6px 0 0;color:var(--muted);font-size:.92rem;max-width:56ch}
.wc-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:760px){.wc-grid{grid-template-columns:1fr}}
.wc-grid figure{margin:0;border:1px solid var(--line);border-radius:18px;padding:16px 12px 12px;background:color-mix(in srgb,var(--bg) 60%,var(--surface));display:grid;gap:8px}
.wc-grid figcaption{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px}
.wc-grid figcaption b{font-family:var(--f-display);font-weight:400;font-size:1.25rem}
.wc-grid figcaption span{font-size:.8rem;color:var(--muted)}
.wc-gap{margin:0;text-align:center;font-size:.85rem;color:var(--muted)}.wc-gap b{color:var(--fg)}
.wc-legend{display:flex;gap:20px;justify-content:center;font-size:.82rem;color:var(--muted)}
.wc-legend span{display:inline-flex;align-items:center;gap:8px}
.wc-legend i{width:18px;height:10px;border-radius:3px}
.lg-a{background:color-mix(in srgb,var(--spirit) 30%,transparent);border:2px solid var(--spirit)}
.lg-b{background:color-mix(in srgb,var(--accent) 30%,transparent);border:2px solid var(--accent)}
.wd{display:grid;gap:10px}
.wd-h{margin:0 0 2px;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wd-row{display:grid;grid-template-columns:10px 120px 1fr 26px 30px;gap:12px;align-items:center;font-size:.92rem}
.wd-row>i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.wd-row.d-s{--c:var(--spirit)}.wd-row.d-m{--c:var(--matter)}.wd-row.d-v{--c:var(--vital)}
.wd-bar{position:relative;height:10px;border-radius:5px;background:var(--bg-2);overflow:hidden}
.wd-bar em{position:absolute;inset:0 auto 0 0;border-right:2px solid var(--fg);opacity:.45;z-index:2}
.wd-bar b{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--c);opacity:.85}
.wd-row strong{text-align:right}
.wd-row small{font-weight:700;font-size:.8rem;color:var(--muted)}.wd-row small.up{color:var(--accent)}.wd-row small.down{color:var(--vital)}
@media (max-width:520px){.wd-row{grid-template-columns:10px 92px 1fr 22px 26px;gap:8px;font-size:.86rem}}
.wc-orig{border-top:1px solid var(--line);padding-top:12px}
.wc-orig summary{cursor:pointer;font-weight:600;font-size:.92rem;color:var(--accent)}
.wc-orig p{margin:10px 0 0;color:var(--muted);font-size:.92rem;line-height:1.6}
.ad-radar{max-width:420px;margin:0 auto;width:100%}

.boot-load{min-height:100%;display:grid;place-content:center;gap:14px;justify-items:center;color:var(--muted);font-size:.95rem;padding:40px;text-align:center}
.boot-load span{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 0.9s linear infinite}

<div id="root"></div>

<script>
(function(){
'use strict';
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var root = document.getElementById('root');
var KEY='aurea-demo-v1';
var S = load() || fresh();
function fresh(){ return {stage:'reg', reg:{}, diag:{}, route:null, done:{}, practice:{}, dayOffset:0, subscribed:false, plan:'anual'}; }
function load(){ try{ var s=localStorage.getItem(KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if(typeof cloud==='function' && cloud()){ cloudPush(); return; }
  if(S.reg && S.reg.email && S.reg.registeredAt){ var u=users(); u[mailKey(S.reg.email)]=S; jset(UKEY,u); } }
/* Prototipo: cuentas y configuración en este navegador. En la versión real lo guarda el servidor. */
var UKEY='aurea-usuarios', CKEY='aurea-config';
function jget(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function jset(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function users(){ if(typeof cloud==='function' && cloud()) return admCache||{}; return jget(UKEY,{}); }
function mailKey(m){ return String(m||'').trim().toLowerCase(); }
function cfg(){ var c=jget(CKEY,{}); return {trialDays:c.trialDays>0?c.trialDays:30, priceM:c.priceM>0?c.priceM:9.99, priceA:c.priceA>0?c.priceA:79, admin:c.admin||null}; }
function fmtP(n){ n=+n; return (Math.round(n*100)%100?n.toFixed(2):String(Math.round(n))).replace('.',','); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function up(s){ return String(s||'').toUpperCase(); }

/* ================= CONTENIDO ================= */
var PILLARS={s:{name:'Espíritu',cls:'d-s',day:'Lunes'},m:{name:'Prosperidad',cls:'d-m',day:'Miércoles'},v:{name:'Vitalidad',cls:'d-v',day:'Viernes'}};
var CAPS=[
 /* ---- ESPÍRITU ---- */
 {id:'s1',p:'s',t:['ansiedad','calma'],title:'Enfócate en lo que depende de ti',min:4,
  body:['Gran parte de nuestra angustia viene de intentar controlar cosas que no dependen de nosotros: lo que otros piensan, el clima, el pasado, el resultado final de un esfuerzo.','Lo que sí depende de ti es tu atención, tus decisiones y la forma en que respondes. Cuando separas una cosa de la otra, la energía que perdías preocupándote vuelve a estar disponible para actuar.'],
  practice:'Cada vez que algo te preocupe esta semana, escríbelo en dos columnas: «depende de mí» y «no depende de mí». Actúa solo sobre la primera.',
  origin:'Estoicismo',ref:'La «dicotomía del control» de Epicteto, filósofo griego del siglo I.'},
 {id:'s2',p:'s',t:['ansiedad','calma'],title:'Por qué sufrimos y qué podemos hacer',min:5,
  body:['El dolor forma parte de la vida: pérdidas, cambios, enfermedades. Pero gran parte del sufrimiento viene de algo más: de resistirnos a lo que ocurre y aferrarnos a que las cosas sean de otra manera.','Reconocer esto no es resignarse. Es el primer paso para dejar de pelear con la realidad y empezar a transformarla desde un lugar más sereno.'],
  practice:'Cuando sientas malestar, pregúntate: «¿Qué es lo que pasó, y qué es lo que yo le estoy agregando?». Anota la diferencia.',
  origin:'Budismo',ref:'Las Cuatro Nobles Verdades: el sufrimiento existe, tiene una causa, puede cesar, y hay un camino para lograrlo.'},
 {id:'s3',p:'s',t:['ego','relaciones'],title:'Cuando necesitas que otros te aprueben',min:4,
  body:['Buscar aprobación es humano, pero cuando se vuelve una necesidad, tu bienestar queda en manos ajenas. Cada crítica duele de más y cada elogio dura poco.','La salida es construir un criterio propio: actuar según tus valores, aunque nadie aplauda. La confianza que nace ahí no depende de nadie.'],
  practice:'Antes de publicar, opinar o decidir algo esta semana, pregúntate: «¿Lo haría igual si nadie se enterara?».',
  origin:'Psicología y Budismo',ref:'El ego como identificación con la propia imagen, y el apego a la opinión ajena.'},
 {id:'s4',p:'s',t:['pasado','calma'],title:'Nada dura, y eso es una buena noticia',min:4,
  body:['Todo cambia: las estaciones, las personas, las emociones. Solemos ver eso como una amenaza, porque lo bueno también termina.','Pero el mismo principio aplica a lo difícil. La tristeza de hoy, la crisis económica o el mal momento también pasarán. Saberlo nos permite disfrutar más y sufrir menos.'],
  practice:'Al final de cada día, anota algo que cambió desde la mañana: un ánimo, una situación, una idea.',
  origin:'Budismo y Estoicismo',ref:'La impermanencia (anicca en el Budismo); Marco Aurelio también la describe en sus Meditaciones.'},
 {id:'s5',p:'s',t:['proposito'],title:'Vivir sabiendo que el tiempo es limitado',min:4,
  body:['Recordar que nuestro tiempo tiene un final no es pesimismo. Es la forma más directa de dejar de posponer lo importante y soltar lo que no lo es.','Una pregunta sencilla ordena las prioridades: si este fuera uno de mis últimos años, ¿en qué dejaría de gastar mi tiempo?'],
  practice:'Antes de dormir, anota algo valioso de tu día y algo que puedes soltar.',
  origin:'Estoicismo',ref:'La práctica romana del memento mori, «recuerda que morirás».'},
 {id:'s6',p:'s',t:['pasado'],title:'Amar lo que te toca vivir',min:4,
  body:['No elegimos todo lo que nos ocurre, pero sí elegimos cómo lo miramos. Hay quienes ven cada obstáculo como una injusticia y quienes lo ven como material para crecer.','Aceptar plenamente tu historia, incluso lo que dolió, te devuelve el poder: dejas de ser víctima de lo que pasó y te conviertes en quien decide qué hacer con ello.'],
  practice:'Escribe una dificultad de tu pasado y tres cosas que aprendiste o ganaste gracias a ella.',
  origin:'Estoicismo',ref:'El amor fati, «amor al destino», presente en Epicteto y Marco Aurelio, y popularizado por Nietzsche.'},
 {id:'s7',p:'s',t:['calma','ansiedad'],title:'Fluir en lugar de forzar',min:4,
  body:['El agua no lucha contra la roca: la rodea, y con el tiempo la moldea. Muchas veces avanzamos más cuando dejamos de empujar y empezamos a observar el momento adecuado.','Fluir no es quedarse quieto. Es actuar con el mínimo esfuerzo necesario, sin tensión ni ansiedad por el resultado.'],
  practice:'Identifica una situación donde estés forzando las cosas. Esta semana, prueba hacer menos y observar más.',
  origin:'Taoísmo',ref:'El wu wei, «acción sin esfuerzo», del Tao Te Ching de Lao Tse.'},
 {id:'s8',p:'s',t:['pasado','ego'],title:'Tener sin que las cosas te tengan',min:4,
  body:['Desapegarse no significa no tener nada ni dejar de querer. Significa que tu paz no depende de conservar algo: una persona, un objeto, un cargo o una idea de ti mismo.','Cuando sostienes las cosas con la mano abierta, las disfrutas sin miedo a perderlas.'],
  practice:'Elige algo a lo que te sientas muy apegado. Imagina tu vida sin ello y escribe qué sigue en pie.',
  origin:'Budismo',ref:'El apego (upādāna) como raíz del sufrimiento y el desapego como libertad.'},
 {id:'s9',p:'s',t:['pasado','relaciones'],title:'Perdonar para soltar, no para olvidar',min:5,
  body:['El perdón no cambia lo que pasó ni obliga a reconciliarse. Cambia el peso que llevas dentro.','Guardar rencor es mantener a otra persona viviendo en tu mente. Perdonar es un acto de amor propio: abre la puerta a la paz interior.'],
  practice:'Escribe una carta, que no vas a enviar, a alguien a quien te cuesta perdonar. Al terminar, rómpela.',
  origin:'Tradiciones contemplativas',ref:'El perdón está presente en el Budismo, el cristianismo y la psicología actual como herramienta de sanación.'},
 {id:'s10',p:'s',t:['ego','ansiedad','relaciones'],title:'Responder en lugar de reaccionar',min:4,
  body:['Entre lo que pasa y lo que haces hay un espacio. Cuando reaccionas, ese espacio desaparece y decide la emoción del momento.','Respirar, contar hasta diez o simplemente nombrar lo que sientes amplía ese espacio. Ahí está tu libertad.'],
  practice:'Cuando sientas enojo o frustración esta semana, nombra la emoción en voz baja antes de responder.',
  origin:'Inteligencia emocional y Estoicismo',ref:'La autorregulación descrita por Daniel Goleman, y la idea de Epicteto: no nos perturban las cosas, sino nuestra interpretación de ellas.'},
 {id:'s11',p:'s',t:['proposito'],title:'Como es adentro, es afuera',min:4,
  body:['Tu mundo exterior suele reflejar tu mundo interior. Una mente desordenada tiende a crear una vida desordenada, y una mente en calma encuentra orden.','Si quieres cambiar algo afuera, empieza por revisar lo que piensas y sientes sobre ello.'],
  practice:'Ordena un espacio pequeño de tu casa. Observa cómo cambia tu estado de ánimo.',
  origin:'Hermetismo',ref:'El principio de correspondencia: «como es arriba, es abajo; como es adentro, es afuera».'},
 {id:'s12',p:'s',t:['calma'],title:'Los días buenos y malos tienen un ritmo',min:4,
  body:['Todo tiene su vaivén: la energía, el ánimo, los negocios. Después de una subida viene una bajada, y después de una bajada, otra subida.','Saberlo evita dos errores: creer que un mal momento es para siempre y confiarse demasiado cuando todo va bien.'],
  practice:'Durante siete días, califica tu energía del 1 al 10 cada noche. Al final, observa el patrón.',
  origin:'Hermetismo',ref:'El principio de ritmo, uno de los siete principios del Kybalión.'},
 {id:'s13',p:'s',t:['proposito'],title:'Un camino de ocho pasos para vivir mejor',min:5,
  body:['Una vida plena no depende de una sola gran decisión, sino de varias prácticas diarias: cómo miras la vida, qué intenciones tienes, cómo hablas, cómo actúas, cómo te ganas la vida, dónde pones tu esfuerzo, tu atención y tu concentración.','Ninguna es perfecta al inicio. Se cultivan juntas, poco a poco.'],
  practice:'Elige uno de esos ocho aspectos y mejóralo de forma concreta durante la semana.',
  origin:'Budismo',ref:'El Noble Óctuple Sendero, el camino que propone Buda para dejar atrás el sufrimiento.'},
 {id:'s14',p:'s',t:['ego','calma'],title:'Nada existe por sí solo',min:4,
  body:['Lo que llamamos «yo» está hecho de tus padres, tus maestros, tu idioma, la comida que comiste hoy y miles de personas que nunca conocerás.','Comprender esta interdependencia reduce el ego y aumenta la gratitud: nadie se hace solo.'],
  practice:'Antes de comer, piensa en cinco personas que hicieron posible ese plato.',
  origin:'Budismo',ref:'La vacuidad (śūnyatā): nada tiene una existencia separada e independiente.'},
 /* ---- PROSPERIDAD ---- */
 {id:'m1',p:'m',t:['creencias'],title:'Lo que te dijeron sobre el dinero',min:5,
  body:['«El dinero es sucio», «los ricos son malas personas», «para ganar hay que sufrir». Muchas de estas frases las escuchamos de niños y siguen decidiendo por nosotros.','Una creencia limitante no se elimina ignorándola: se reemplaza cuando la descubres, la cuestionas y eliges una nueva.'],
  practice:'Escribe tres frases sobre el dinero que escuchabas en casa. Al lado de cada una, escribe una versión que te impulse.',
  origin:'Psicología del dinero',ref:'El estudio de las creencias financieras heredadas, base de muchos programas de mentalidad de prosperidad.'},
 {id:'m2',p:'m',t:['creencias'],title:'La voz que te habla por dentro',min:4,
  body:['Todos tenemos un diálogo interno. A veces nos anima, y muchas veces nos sabotea: «no eres capaz», «eso no es para ti».','Lo que te dices a ti mismo define lo que te atreves a intentar. Cambiar ese diálogo es una de las inversiones más rentables que existen.'],
  practice:'Cada vez que te descubras pensando «no puedo», cámbialo por «¿cómo podría?».',
  origin:'Psicología cognitiva',ref:'El trabajo sobre el diálogo interno y la reestructuración cognitiva (Aaron Beck, Albert Ellis).'},
 {id:'m3',p:'m',t:['ahorro'],title:'Págate primero a ti',min:5,
  body:['La mayoría de las personas paga todas sus cuentas y ahorra lo que sobra. La idea es invertir el orden: apartar tu parte antes de gastar, aunque sea un porcentaje pequeño.','El monto importa menos que el hábito. Empezar con el 5% o el 10% cambia tu relación con el dinero.'],
  practice:'Programa una transferencia automática a una cuenta de ahorro el día que recibes tus ingresos.',
  origin:'Finanzas personales clásicas',ref:'Principio popularizado por George S. Clason en 1926.'},
 {id:'m4',p:'m',t:['ahorro','deudas'],title:'Saber a dónde va tu dinero',min:5,
  body:['No puedes mejorar lo que no mides. Muchas personas sienten que el dinero «se les va» sin saber exactamente en qué.','Registrar tus gastos durante un mes no es para castigarte, sino para tomar decisiones con información.'],
  practice:'Anota todos tus gastos durante siete días, incluso los más pequeños.',
  origin:'Finanzas personales',ref:'El presupuesto y el registro de gastos, base de toda planificación financiera.'},
 {id:'m5',p:'m',t:['ahorro','deudas'],title:'Un colchón para la tranquilidad',min:4,
  body:['Una emergencia sin ahorro se convierte en deuda. Un fondo de emergencia te da algo que vale más que el dinero: tranquilidad para decidir sin miedo.','La meta habitual es reunir entre tres y seis meses de gastos básicos, pero se empieza con la primera pequeña cantidad.'],
  practice:'Calcula cuánto gastas al mes en lo básico. Esa es la medida de tu primer objetivo.',
  origin:'Finanzas personales',ref:'El fondo de emergencia, recomendado por la mayoría de los planificadores financieros.'},
 {id:'m6',p:'m',t:['deudas'],title:'Salir de deudas paso a paso',min:5,
  body:['Las deudas pesan en el bolsillo y también en la mente. La clave es dejar de verlas como un monstruo y convertirlas en una lista con orden.','Un método sencillo: paga el mínimo en todas y destina todo lo extra a la más pequeña. Cuando la terminas, ese dinero se suma a la siguiente.'],
  practice:'Haz una lista de tus deudas con su monto y su tasa de interés. Solo con verlas en papel ya recuperas el control.',
  origin:'Finanzas personales',ref:'El método «bola de nieve» para pagar deudas.'},
 {id:'m7',p:'m',t:['invertir'],title:'Lo que suma y lo que resta a tu patrimonio',min:5,
  body:['Un activo pone dinero en tu bolsillo; un pasivo lo saca. Muchas compras que parecen inversiones, como un auto nuevo, en realidad son gastos que se repiten.','No se trata de no disfrutar, sino de comprar activos primero y dejar que ellos paguen los gustos.'],
  practice:'Clasifica tus diez gastos o bienes principales en «me da dinero» y «me cuesta dinero».',
  origin:'Educación financiera',ref:'La distinción entre activos y pasivos, popularizada por Robert Kiyosaki.'},
 {id:'m8',p:'m',t:['invertir','ahorro'],title:'El dinero que trabaja para ti',min:4,
  body:['Cuando inviertes, tus ganancias generan nuevas ganancias. Al principio parece poco, pero con los años el crecimiento se acelera.','El factor más poderoso no es cuánto inviertes, sino cuánto tiempo dejas trabajar tu dinero. Por eso conviene empezar pronto, aunque sea con poco.'],
  practice:'Usa una calculadora de interés compuesto en línea y mira cuánto crecerían 20 dólares al mes durante 20 años.',
  origin:'Matemática financiera',ref:'El interés compuesto, base de toda inversión a largo plazo.'},
 {id:'m9',p:'m',t:['ingresos'],title:'Ganar más empieza por aportar más',min:4,
  body:['Los ingresos suelen ser un reflejo del valor que aportas y de cuántas personas lo reciben.','La pregunta útil no es «¿cómo gano más?», sino «¿qué problema puedo resolver mejor, o para más personas?».'],
  practice:'Escribe tres habilidades tuyas y un problema concreto que cada una podría resolver para otros.',
  origin:'Filosofía del éxito',ref:'La ley de compensación descrita por Ralph Waldo Emerson.'},
 {id:'m10',p:'m',t:['creencias','ahorro'],title:'Pequeños pasos, grandes cambios',min:4,
  body:['No necesitas una gran transformación de un día para otro. Mejorar un 1% cada día produce resultados enormes con el tiempo.','Los hábitos pequeños son fáciles de empezar y difíciles de abandonar.'],
  practice:'Elige un micro-hábito financiero de menos de dos minutos (por ejemplo, revisar tu saldo cada mañana) y hazlo los siete días.',
  origin:'Ciencia de los hábitos',ref:'Los micro-hábitos, popularizados por James Clear y BJ Fogg.'},
 {id:'m11',p:'m',t:['creencias'],title:'El fracaso como punto de partida',min:4,
  body:['Quien cree que su capacidad es fija ve cada error como una prueba de que no sirve. Quien cree que puede crecer lo ve como información.','Casi todas las personas exitosas fracasaron muchas veces antes. La diferencia es que siguieron intentando con más inteligencia.'],
  practice:'Escribe un fracaso reciente y responde: ¿qué haría distinto la próxima vez?',
  origin:'Psicología del crecimiento',ref:'La mentalidad de crecimiento, investigada por Carol Dweck en la Universidad de Stanford.'},
 {id:'m12',p:'m',t:['invertir'],title:'No pongas todo en una sola canasta',min:4,
  body:['Toda inversión tiene riesgo. Repartir tu dinero entre distintas opciones reduce la posibilidad de perderlo todo por un solo error.','Antes de invertir, entiende en qué pones tu dinero y desconfía de cualquier promesa de ganancias rápidas y seguras.'],
  practice:'Investiga dos opciones de inversión de bajo riesgo disponibles en tu país y anota sus diferencias.',
  origin:'Principios de inversión',ref:'La diversificación, uno de los fundamentos de la teoría moderna de carteras.'},
 {id:'m13',p:'m',t:['ingresos'],title:'Tu talento también es un activo',min:4,

  practice:'Define una habilidad que quieras aprender este año y dedica 20 minutos esta semana a empezar.',

 {id:'v1',p:'v',t:['energia','sueno'],title:'Agua y luz al despertar',min:4,

  practice:'Al despertar, toma un vaso de agua y sal a la luz natural durante diez minutos antes de revisar el celular.',

 {id:'v2',p:'v',t:['sedentarismo','energia'],title:'Caminar como medicina',min:4,

  practice:'Camina 30 minutos al día, cinco días esta semana. Puedes dividirlo en tres caminatas de diez.',

 {id:'v3',p:'v',t:['alimentacion','peso'],title:'Volver a la comida real',min:4,
  body:['Si tiene una lista larga de ingredientes que no sabrías pronunciar, probablemente no es comida real.','Frutas, verduras, legumbres, granos enteros, huevos, carnes y pescados frescos: mientras menos procesado, mejor.'],
  practice:'Esta semana, cambia un producto ultraprocesado que consumas a diario por una opción natural.',

 {id:'v4',p:'v',t:['sueno'],title:'Dormir mejor empieza de día',min:4,
  body:['El sueño se prepara durante todo el día: con luz por la mañana, movimiento, horarios regulares y menos cafeína por la tarde.','Dormir bien no es un lujo: es cuando tu cuerpo se repara y tu mente ordena lo aprendido.'],
  practice:'Fija una hora para acostarte y respétala los siete días, incluso el fin de semana.',
  origin:'Medicina del sueño',ref:'Las recomendaciones de higiene del sueño.'},
 {id:'v5',p:'v',t:['estres'],title:'Respirar para bajar el estrés',min:3,
  body:['Tu respiración es el control remoto de tu sistema nervioso. Respirar rápido y corto activa la alerta; respirar lento y profundo activa la calma.','Es la herramienta más accesible que tienes, y funciona en minutos.'],
  practice:'Tres veces al día, inhala en 4 tiempos y exhala en 6, durante dos minutos.',
  origin:'Fisiología y tradiciones contemplativas',ref:'La respiración lenta y el sistema nervioso parasimpático; también el pranayama del yoga.'},
 {id:'v6',p:'v',t:['alimentacion','peso'],title:'La mitad del plato con plantas',min:4,
  body:['Una guía sencilla para cada comida: la mitad del plato con verduras y frutas, un cuarto con proteína y un cuarto con granos enteros.','No hace falta contar calorías para comer mejor.'],
  practice:'Arma al menos una comida al día con esta proporción.',
  origin:'Nutrición',ref:'El «plato para comer saludable» de la Escuela de Salud Pública de Harvard.'},
 {id:'v7',p:'v',t:['sedentarismo','peso'],title:'Fuerza a cualquier edad',min:4,
  body:['Con los años perdemos masa muscular si no la usamos. Entrenar la fuerza protege tus huesos, tu metabolismo y tu independencia futura.','Sentadillas, flexiones apoyado en una pared o subir escaleras ya cuentan.'],
  practice:'Dos veces esta semana, haz 3 series de 10 sentadillas y 10 flexiones adaptadas a tu nivel.',
  origin:'Medicina del ejercicio',ref:'La recomendación de la OMS de entrenar la fuerza al menos dos días por semana.'},
 {id:'v8',p:'v',t:['peso','alimentacion','estres'],title:'Comer con atención',min:4,
  body:['Comer frente a una pantalla hace que comamos más y disfrutemos menos. El cuerpo tarda unos veinte minutos en avisar que está satisfecho.','Comer despacio y con atención es una forma de meditación diaria.'],
  practice:'Haz una comida al día sin pantallas, dejando los cubiertos en la mesa entre cada bocado.',
  origin:'Alimentación consciente',ref:'El mindful eating, derivado de la práctica de la atención plena.'},
 {id:'v9',p:'v',t:['sueno'],title:'Menos pantalla antes de dormir',min:3,
  body:['La luz de las pantallas y el contenido que consumimos de noche mantienen al cerebro en alerta.','La última hora del día es para bajar el ritmo: leer, conversar, estirarte.'],
  practice:'Deja el celular fuera de la habitación, o en modo avión, una hora antes de dormir.',
  origin:'Medicina del sueño',ref:'El efecto de la luz nocturna sobre la producción de melatonina.'},
 {id:'v10',p:'v',t:['peso','alimentacion','energia'],title:'El azúcar escondido',min:4,
  body:['Bebidas, salsas, panes, yogures y cereales suelen tener azúcar agregado aunque no lo parezca.','Reducirlo estabiliza tu energía durante el día y disminuye los antojos.'],

  origin:'Nutrición',ref:'La recomendación de la OMS de limitar los azúcares libres a menos del 10% de la energía diaria.'},
 {id:'v11',p:'v',t:['sedentarismo','energia'],title:'Moverte cada hora',min:3,

 {id:'v12',p:'v',t:['estres','energia'],title:'Volver a la naturaleza',min:4,
  body:['Pasar tiempo entre árboles, en un parque o junto al mar reduce el estrés y mejora el ánimo de forma medible.','No hace falta irse lejos: un parque cercano también cuenta.'],

 {id:'v13',p:'v',t:['estres','energia','relaciones'],title:'Relaciones que dan salud',min:4,

  practice:'Llama o visita a alguien importante para ti con quien no hablas hace tiempo.',
  origin:'Psicología y salud',ref:'El Estudio de Harvard sobre el Desarrollo Adulto, iniciado en 1938.'}
