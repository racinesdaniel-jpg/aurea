        .catch(function(e){ er.textContent=LANG==='en'?'I could not confirm the payment.':((e&&e.message)||'No pude confirmar el pago.'); er.hidden=false; }); },
      onError:function(){ er.textContent=LX('PayPal no pudo completar el pago. Intenta de nuevo.','PayPal could not complete the payment. Please try again.'); er.hidden=false; }
    }).render(box); }); })
  .catch(function(e){ box.innerHTML=''; er.textContent=LANG==='en'?'PayPal is not available right now.':((e&&e.message)||'PayPal no está disponible ahora.'); er.hidden=false; });
}
/* Al volver de Payphone: /app.html?pago=ok|cancelado|rechazado|error */
function payReturn(){
  var m=/[?&]pago=(\w+)/.exec(location.search); if(!m) return;
  try{ history.replaceState(null,'',location.pathname+location.hash); }catch(e){}
  var t=LX({ok:'Pago aprobado con Payphone. Tu suscripción está activa.',cancelado:'Cerraste el pago. No se hizo ningún cobro.',rechazado:'El banco no aprobó el pago. Puedes intentar con otra tarjeta.',error:'No pude confirmar el pago. Si se hizo el cobro, escríbenos a info@aureamentor.com.'},{ok:'Payment approved with Payphone. Your subscription is active.',cancelado:'You closed the payment. No charge was made.',rechazado:'The bank did not approve the payment. You can try another card.',error:'I could not confirm the payment. If you were charged, write to us at info@aureamentor.com.'})[m[1]];
  if(t) setTimeout(function(){ toast(t); },600);
}
function loadSettings(){
  return FB.f.getDoc(FB.f.doc(FB.db,'settings','app')).then(function(d){ if(!d.exists()) return; var v=d.data(), cc=jget(CKEY,{});
    ['trialDays','priceM','priceA'].forEach(function(k){ if(+v[k]>0) cc[k]=+v[k]; }); if(v.payIva!=null) cc.payIva=+v.payIva; cc.payPayphone=!!v.payPayphone; cc.payPaypal=!!v.payPaypal; ANIM_KEYS.forEach(function(k){ if(v[k]!=null && +v[k]>=0) cc[k]=+v[k]; }); AI_KEYS.forEach(function(k){ if(v[k]!=null) cc[k]=v[k]; }); jset(CKEY,cc); AN=null; }).catch(function(){});
}
function cloudInit(){
  if(!FBC) return Promise.resolve();
  root.innerHTML='<div class="boot-load" role="status"><span></span>'+LX('Cargando…','Loading…')+'</div>';
  var base='https://www.gstatic.com/firebasejs/10.12.2/';
  return Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]).then(function(m){
    var app=m[0].initializeApp(FBC);
    /* App Check (reCAPTCHA Enterprise): se activa al poner appCheckKey en firebase-config.js; por ahora el servidor solo lo monitorea */
    if(FBC.appCheckKey) import(base+'firebase-app-check.js').then(function(ac){ ac.initializeAppCheck(app,{provider:new ac.ReCaptchaEnterpriseProvider(FBC.appCheckKey),isTokenAutoRefreshEnabled:true}); }).catch(function(e){ console.warn('App Check no disponible',e); });
    var db; try{ db=m[2].initializeFirestore(app,{localCache:m[2].persistentLocalCache({tabManager:m[2].persistentMultipleTabManager()})}); }catch(e){ db=m[2].getFirestore(app); }
    FB={app:app,auth:m[1].getAuth(app),db:db,a:m[1],f:m[2]};
    try{ FB.auth.languageCode=LANG; }catch(e){}
    return new Promise(function(res){ var un=null, got=false; un=FB.a.onAuthStateChanged(FB.auth,function(u){ fbUser=u; if(got) return; got=true; if(un) un(); else setTimeout(function(){ un&&un(); },0); res(); }); });
  }).then(function(){ return Promise.all([loadSettings(), fbUser?loadMine():null]); })
  .catch(function(e){ console.warn('Firebase no disponible; modo local',e); FB=null; fbUser=null; });
}
/* --- Registro, inicio de sesión y contraseña en la nube --- */
var pendingPw=null;
function cloudRegister(onOk,onErr){
  var mail=String(S.reg.email||'').trim();
  function done(u){ fbUser=u; pendingPw=null; markSeen(); onOk(); setTimeout(function(){ if(fbUser) loadSub(); },1500); }
  if(fbUser && mailKey(fbUser.email)===mailKey(mail)) return done(fbUser);
  if(!pendingPw){ onErr({code:'need-pw'}); return; }
  FB.a.createUserWithEmailAndPassword(FB.auth,mail,pendingPw).then(function(cr){ fbUser=cr.user; setTimeout(function(){ sendVerify(cr.user).catch(function(){}); },1200); done(cr.user); }).catch(function(e){
    if(e&&e.code==='auth/email-already-in-use'){
      /* La cuenta ya existe (por ejemplo, el acceso de administrador) pero puede no tener registro de usuario: si la contraseña coincide, se completa el registro. */
      FB.a.signInWithEmailAndPassword(FB.auth,mail,pendingPw).then(function(cr){
        return FB.f.getDoc(userRef(cr.user.uid)).then(function(d){ if(d.exists()){ fbUser=cr.user; pendingPw=null; return loadMine().then(function(){ boot(); }); } done(cr.user); });
      }).catch(function(){ onErr(e); });
      return;
    }
    onErr(e); });
}
/* Correos de Áurea desde info@aureamentor.com (si la función no está disponible, se usa el correo de Firebase) */
function sendVerify(u){ return fnCall('correoVerificacion',{lang:LANG,nombre:(S.reg&&S.reg.name)||''}).catch(function(e){ if(String(e&&e.code||'').indexOf('resource-exhausted')>=0) throw e; return FB.a.sendEmailVerification(u||fbUser); }); }
function sendReset(em){ return fnCall('correoClave',{email:em,lang:LANG}).catch(function(e){ var c=String(e&&e.code||''); if(c.indexOf('resource-exhausted')>=0||c.indexOf('invalid-argument')>=0) throw e; return FB.a.sendPasswordResetEmail(FB.auth,em); }); }
/* Enlaces de los correos: ?modo=verificar|clave&codigo=… */
function mailAction(){
  var q=new URLSearchParams(location.search), modo=q.get('modo'), code=q.get('codigo'); if(!cloud()||!code||(modo!=='verificar'&&modo!=='clave')) return false;
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
  function msg(t,x,go){ modal(t,'<p class="m-note">'+x+'</p><div class="m-act"><button type="button" class="btn btn-primary" data-x>'+LX('Continuar','Continue')+'</button></div>',function(ov,close){ ov.querySelector('[data-x]').onclick=function(){ close(); go&&go(); }; }); }
  if(modo==='verificar'){
    FB.a.applyActionCode(FB.auth,code).then(function(){ var u=FB.auth.currentUser; return u?u.reload().then(function(){ return u.getIdToken(true); }):null; })
      .then(function(){ boot(); msg(LX('Tu correo quedó confirmado','Your email is confirmed'),LX('Gracias. Ya puedes conversar con Áurea y usar toda la app.','Thank you. You can now talk with Áurea and use the whole app.')); })
      .catch(function(){ boot(); msg(LX('No pudimos confirmar tu correo','We could not confirm your email'),LX('El enlace ya se usó o venció. Si tu correo aún no está confirmado, Áurea te enviará uno nuevo cuando lo necesites.','The link was already used or has expired. If your email is not confirmed yet, Áurea will send you a new one when needed.')); });
    return true; }
  FB.a.verifyPasswordResetCode(FB.auth,code).then(function(email){
    root.innerHTML='';
    modal(LX('Crea una contraseña nueva','Create a new password'),'<form class="login mform" novalidate><p class="m-note">'+esc(email)+'</p>'+pwFld('r-new',LX('Contraseña nueva','New password'),'new-password')+pwFld('r-rep',LX('Repite la contraseña','Repeat the password'),'new-password')+
      '<p class="m-note">'+LX('Usa al menos 8 caracteres y combina letras y números.','Use at least 8 characters and combine letters and numbers.')+'</p><p class="err" id="r-err"></p><div class="m-act"><button type="submit" class="btn btn-primary">'+LX('Guardar contraseña','Save password')+'</button></div></form>',
    function(ov,close){ wireEyes(ov); var err=ov.querySelector('#r-err'); ov.querySelector('.close').onclick=function(){ close(); boot(); };
      ov.querySelector('form').onsubmit=function(e){ e.preventDefault(); var nw=ov.querySelector('#r-new').value, rp=ov.querySelector('#r-rep').value, m0=regRule('pw')(nw);
        if(m0){ err.textContent=m0; return; } if(nw!==rp){ err.textContent=LX('Las contraseñas no coinciden.','The passwords do not match.'); return; }
        FB.a.confirmPasswordReset(FB.auth,code,nw).then(function(){ close(); markSeen(); try{ history.replaceState(null,'',location.pathname+'#login'); }catch(x){} boot(); toast(LX('Tu contraseña se cambió. Ya puedes ingresar con ella.','Your password was changed. You can now sign in with it.')); })
          .catch(function(x){ err.textContent=fbErr(x); }); };
      ov.querySelector('#r-new').focus({preventScroll:true}); });
  }).catch(function(){ boot(); msg(LX('El enlace ya no es válido','The link is no longer valid'),LX('Ya se usó o venció. Pide uno nuevo con «¿Olvidaste tu contraseña?».','It was already used or has expired. Request a new one with “Forgot your password?”.')); });
  return true;
}
/* Este navegador ya tuvo una cuenta de Áurea: solo entonces «Entrar» abre el inicio de sesión («Qué bueno verte de nuevo») */
var SEEN_KEY='aurea-ya-ingreso';
function markSeen(){ try{ localStorage.setItem(SEEN_KEY,'1'); }catch(e){} }
function seenHere(){ try{ return localStorage.getItem(SEEN_KEY)==='1'; }catch(e){ return false; } }
function cloudLogin(mail,pw){
  return FB.a.signInWithEmailAndPassword(FB.auth,String(mail).trim(),pw).then(function(cr){ fbUser=cr.user; markSeen(); return loadMine(); });
}
/* Datos personales guardados en este navegador: se borran al cerrar sesión (computadoras compartidas) */
function clearLocalPersonal(){ try{ Object.keys(localStorage).forEach(function(k){ if(k===KEY||k===AUTH_KEY||k.indexOf('aurea-diario-')===0||k==='aurea-visto') localStorage.removeItem(k); }); }catch(e){} }
var fsCleared=false;
function cloudLogout(){ if(pushT) cloudPush(true); syncStop(); return FB.a.signOut(FB.auth).catch(function(){}).then(function(){
    /* La copia sin conexión de Firestore (incluido el diario) se borra; después hay que recargar la página para volver a ingresar */
    return FB.f.terminate(FB.db).then(function(){ return FB.f.clearIndexedDbPersistence(FB.db); }).then(function(){ fsCleared=true; }).catch(function(e){ console.warn('No se pudo borrar la copia local',e); fsCleared=true; }); }).then(function(){ clearLocalPersonal(); fbUser=null; S=fresh(); DIA=null; AIH=[]; AI_LEFT=null; SUB=null; lastPushed=null; lastAt=0; try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }); }
function cloudChangePw(cur,nw){
  return FB.a.reauthenticateWithCredential(fbUser,FB.a.EmailAuthProvider.credential(fbUser.email,cur)).then(function(){ return FB.a.updatePassword(fbUser,nw); });
}
/* --- Administración en la nube --- */
function cloudLoadAll(){
  var SUBS={};
  return FB.f.getDocs(FB.f.collection(FB.db,'subs')).then(function(q){ q.forEach(function(d){ SUBS[d.id]=d.data()||{}; }); }).catch(function(){})
  .then(function(){ return FB.f.getDocs(FB.f.collection(FB.db,'users')); }).then(function(snap){ var all={};
    snap.forEach(function(d){ var s=cleanState(unpack(d)), em=String((d.data()||{}).email||''); if(s&&s.reg&&(em||s.reg.email)){ s._id=d.id; if(em) s.reg.email=em;
      var sb=SUBS[d.id]||{}; s.subscribed=sb.active===true&&!(sb.currentPeriodEnd&&sb.currentPeriodEnd<Date.now()); if(s.subscribed&&sb.plan) s.plan=sb.plan; if(typeof sb.trialEnd==='number') s._te=sb.trialEnd;
      all[mailKey(s.reg.email)]=s; } }); admCache=all; });
}
function cloudAdminOk(){ return cloud() && fbUser && isAdmEmail(fbUser.email) && fbUser.emailVerified; }
function adminLoginCloud(){
  var el=botScreen({phase:'Administración',noLang:true}); el.classList.add('compact');
  var q=el.querySelector('#q'), hint=el.querySelector('#hint'), ans=el.querySelector('#answer'), next=el.querySelector('#next'), back=el.querySelector('#back'), dots=el.querySelector('#dots');
  el.querySelector('#tap').remove(); dots.innerHTML='<button type="button" class="forgot" id="aNew">Primera vez: crear mi acceso</button>';
  back.textContent='← Volver'; back.disabled=false; back.onclick=leaveAdmin; next.textContent='Ingresar';
  ans.innerHTML='<form class="login" novalidate>'+fld('a-mail','Correo de administrador',fbUser?fbUser.email:'','email','maxlength="80" autocomplete="username" placeholder="tucorreo@ejemplo.com"')+pwFld('a-pw','Contraseña','current-password')+'<p class="err" id="a-err"></p></form>';
  wireEyes(ans);
  var err=ans.querySelector('#a-err');
  ans.querySelector('form').onsubmit=function(e){ e.preventDefault(); next.click(); };
  ans.querySelectorAll('input').forEach(function(i){ i.oninput=function(){ err.textContent=''; }; });
  function vals(){ return {m:ans.querySelector('#a-mail').value.trim(), p:ans.querySelector('#a-pw').value}; }
  function verifyMsg(u){ return FB.a.sendEmailVerification(u).catch(function(){}).then(function(){ err.textContent=''; hint.textContent='Te enviamos un correo a '+u.email+'. Abre el enlace para confirmar que es tuyo y luego vuelve a ingresar aquí.'; }); }
  next.onclick=function(){ var v=vals();
    if(!isAdmEmail(v.m)){ err.textContent='Este correo no tiene permiso de administrador.'; return; }
    next.disabled=true;
    FB.a.signInWithEmailAndPassword(FB.auth,v.m,v.p).then(function(cr){ fbUser=cr.user; return cr.user.reload().then(function(){ return FB.auth.currentUser; }); })
     .then(function(u){ next.disabled=false; if(!u.emailVerified) return verifyMsg(u); return u.getIdToken(true).then(function(){ adminPanel('resumen'); }); })
     .catch(function(e){ next.disabled=false; err.textContent=fbErr(e)+((e.code==='auth/invalid-credential'||e.code==='auth/user-not-found')?' Si es tu primera vez, usa «Primera vez: crear mi acceso».':''); });
  };
  el.querySelector('#aNew').onclick=function(){ var v=vals();
    if(!isAdmEmail(v.m)){ err.textContent='Este correo no tiene permiso de administrador.'; return; }
    var r=regRule('pw')(v.p); if(r){ err.textContent=r; return; }
    FB.a.createUserWithEmailAndPassword(FB.auth,v.m,v.p).then(function(cr){ fbUser=cr.user; return verifyMsg(cr.user); }).catch(function(e){ err.textContent=fbErr(e); });
  };
  typeQA(q,'Acceso de administrador.',hint,'Ingresa con tu correo y tu contraseña de administrador.',function(){ ans.classList.remove('wait'); });
}
function cloudSaveSettings(d,pm,pa,iva,pph,ppl){
  var v={trialDays:d,priceM:pm,priceA:pa,payIva:iva,payPayphone:!!pph,payPaypal:!!ppl,updatedAt:Date.now()};
  return FB.f.setDoc(FB.f.doc(FB.db,'settings','app'),v,{merge:true}).then(function(){ var cc=jget(CKEY,{}); cc.trialDays=d; cc.priceM=pm; cc.priceA=pa; cc.payIva=iva; cc.payPayphone=!!pph; cc.payPaypal=!!ppl; jset(CKEY,cc); });
}

/* ================= ARRANQUE ================= */
drawOrbs();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){ if(reduce) drawOrbs(); });
function offlineScreen(){
  root.innerHTML='<div class="boot-load" role="alert" style="flex-direction:column;gap:14px;text-align:center;padding:24px"><p style="margin:0">'+
    LX('No pudimos conectarnos con Áurea. Revisa tu conexión a internet e inténtalo de nuevo.','We could not connect to Áurea. Check your internet connection and try again.')+
    '</p><button class="btn btn-primary" type="button" id="offRetry">'+LX('Intentar de nuevo','Try again')+'</button></div>';
  root.querySelector('#offRetry').onclick=function(){ location.reload(); };
}
function boot(){
  /* Con Firebase configurado, la app solo funciona en la nube; el modo local queda para pruebas sin configuración */
  if(FBC && !cloud()){ offlineScreen(); return; }
  if(/^#admin/.test(location.hash)||adminMode){ adminEntry(); return; }
  if(isAuth() && langSync()) return;
  if(cloud() && fbUser && isAdmEmail(fbUser.email) && !(S.reg && S.reg.registeredAt)){ adminEntry(); return; }
  if(fbUser || (S.reg && S.reg.registeredAt)) markSeen();
  if(/^#login/.test(location.hash)){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
    /* En un navegador que nunca tuvo una cuenta se muestra la bienvenida (crear cuenta); desde ahí está «Ya tengo cuenta» */
    if(seenHere() && !(S.reg && S.reg.registeredAt && (cloud()||S.reg.pw) && isAuth())){ loginScreen(); return; } }
  if(!cloud() && S.reg && S.reg.registeredAt && S.reg.email && !users()[mailKey(S.reg.email)]) save();
  if(S.stage!=='reg' && S.reg && S.reg.registeredAt){
    if(!cloud() && !S.reg.pw){ createPwScreen(); return; }
    if(!isAuth()){ loginScreen(); return; }
  }
  if(S.stage==='app' && S.route && !S.routeV2 && S.diag && S.diag.wheel){ reorderRoute(wheelNow().w); S.routeV2=1; save(); }
  if(S.stage==='app' && S.route) renderApp('ruta');
  else if((S.stage==='intro'||S.stage==='building') && S.route) routeIntro();
  else if(S.stage==='diag') welcomeDiag();
  else startReg();
}
cloudInit().then(function(){ if(!mailAction()) boot(); payReturn(); });
window.addEventListener('hashchange',function(){ if(FBC && !cloud()) return; if(/^#admin/.test(location.hash)&&!adminMode){ document.querySelectorAll('.ov').forEach(function(o){o.remove();}); document.body.style.overflow=''; adminEntry(); } });
if(reduce) setInterval(drawOrbs,1000);
})();
