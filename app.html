/* Espiral de la ruta: cada punto es una cápsula, de adentro hacia afuera, alternando Espíritu → Prosperidad → Vitalidad */
function spiralSVG(total,cw){
  var N=total*3, R=208, k0=total<=13?9:14, T=total<=13?2.2:(total<=26?2.9:3.8), TH=T*2*Math.PI, rot=-Math.PI/2;
  function th(k){ return TH*Math.sqrt((k+k0)/(N-1+k0)); }
  function pt(t){ var r=R*t/TH; return [r*Math.cos(t+rot), r*Math.sin(t+rot)]; }
  function path(t0,t1){ var s='', st=.04; for(var t=t0;t<=t1+1e-6;t+=st){ var p=pt(Math.min(t,t1)); s+=(s?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); } var e=pt(t1); return s+'L'+e[0].toFixed(1)+' '+e[1].toFixed(1); }
  var cols=['s','m','v'], lastDone=-1;
  for(var k=0;k<N;k++){ var id=S.route[Math.floor(k/3)]&&S.route[Math.floor(k/3)][k%3]; if(id&&S.done[id]) lastDone=k; else if(Math.floor(k/3)<=cw) break; }
  var withContent=0; while(withContent<total&&S.route[withContent]) withContent++;
  var out='<svg class="spiral" viewBox="-236 -236 472 472" role="group" aria-label="Tu ruta en espiral: '+total+' vueltas">'+
    '<path class="sp-base" d="'+path(th(0),th(withContent*3-1))+'"/>'+
    (withContent<total?'<path class="sp-soon" d="'+path(th(withContent*3-1),th(N-1))+'"/>':'')+
    '<path class="sp-prog" d="'+path(th(0),th(Math.max(0,cw*3)))+'"/>';
  for(var w=0;w<total;w++){
    var ids=S.route[w], isDone=ids&&ids.every(function(id){return S.done[id];});
    var cls='sw'+(isDone?' w-done':w===cw?' w-now':w<cw?' w-open':ids?' w-lock':' w-soon');
    out+='<g class="'+cls+'" data-w="'+w+'" tabindex="0" role="button" aria-label="Vuelta '+(w+1)+'">';
    for(var j=0;j<3;j++){
      var kk=w*3+j, p=pt(th(kk)), id=ids&&ids[j], dn=id&&S.done[id];
      out+='<circle class="cp d-'+cols[j]+(dn?' dn':'')+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(w===cw?7:(dn?5.5:4))+'"/>';
    }
    var pm=pt(th(w*3+1));
    if(w===cw) out+='<circle class="halo" cx="'+pm[0].toFixed(1)+'" cy="'+pm[1].toFixed(1)+'" r="22"/>';
    out+='<circle class="hit" cx="'+pm[0].toFixed(1)+'" cy="'+pm[1].toFixed(1)+'" r="16"/>';
    out+='</g>';
  }
  // hitos: los niveles que se alcanzan dentro de esta ruta
  LEVELS.forEach(function(l){ if(!l.w||l.w>total) return; var t=th(l.w*3-1), p=pt(t), r=Math.hypot(p[0],p[1]), ux=p[0]/r, uy=p[1]/r, reached=weeksDone()>=l.w;
    out+='<g class="ms'+(reached?' on':'')+'"><line x1="'+(p[0]+ux*10).toFixed(1)+'" y1="'+(p[1]+uy*10).toFixed(1)+'" x2="'+(p[0]+ux*20).toFixed(1)+'" y2="'+(p[1]+uy*20).toFixed(1)+'"/><text x="'+(p[0]+ux*26).toFixed(1)+'" y="'+(p[1]+uy*26+3).toFixed(1)+'" text-anchor="'+(ux>.35?'start':ux<-.35?'end':'middle')+'">'+esc(l.name)+'</text></g>'; });
  out+='<g class="sp-center"><text x="0" y="-6">'+(cw+1)+'</text><text class="sm" x="0" y="14">de '+total+'</text></g>';
  return out+'</svg>';
}

   'auth/too-many-requests':'Demasiados intentos. Espera unos minutos y vuelve a intentarlo.','auth/network-request-failed':'No hay conexión. Revisa tu internet e inténtalo de nuevo.',
   'auth/requires-recent-login':'Por seguridad, cierra sesión y vuelve a ingresar antes de hacer este cambio.','permission-denied':'No tienes permiso para hacer esto.'})[c]||'Algo salió mal. Inténtalo de nuevo.'; }
function packState(s){ var o=JSON.parse(JSON.stringify(s)); if(o.reg) delete o.reg.pw; return o; }
function userRef(uid){ return FB.f.doc(FB.db,'users',uid); }
var pushT=null;
function cloudPush(){
  if(!cloud()||!fbUser||!S.reg||!S.reg.registeredAt||mailKey(S.reg.email)!==mailKey(fbUser.email)) return;
  clearTimeout(pushT);
  pushT=setTimeout(function(){ var st=packState(S);
    FB.f.setDoc(userRef(fbUser.uid),{email:mailKey(S.reg.email),name:S.reg.name||'',registeredAt:S.reg.registeredAt||0,updatedAt:Date.now(),state:JSON.stringify(st)}).catch(function(e){ console.warn('No se pudo guardar en la nube',e); }); },400);
}
function unpack(d){ try{ var v=d.data(); var s=JSON.parse(v.state); s._id=d.id; return s; }catch(e){ return null; } }
function loadMine(){
  return FB.f.getDoc(userRef(fbUser.uid)).then(function(d){
    var s=d.exists()?unpack(d):null;
    if(s){ delete s._id; S=s; }
    else if(mailKey(S.reg&&S.reg.email)!==mailKey(fbUser.email)){ S=fresh(); S.reg.email=fbUser.email; }
    try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
  });
}
function loadSettings(){
  return FB.f.getDoc(FB.f.doc(FB.db,'settings','app')).then(function(d){ if(!d.exists()) return; var v=d.data(), cc=jget(CKEY,{});
    ['trialDays','priceM','priceA'].forEach(function(k){ if(+v[k]>0) cc[k]=+v[k]; }); jset(CKEY,cc); }).catch(function(){});
}
function cloudInit(){
  if(!FBC) return Promise.resolve();
  root.innerHTML='<div class="boot-load" role="status"><span></span>Cargando…</div>';
  var base='https://www.gstatic.com/firebasejs/10.12.2/';
  return Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]).then(function(m){
    var app=m[0].initializeApp(FBC);
    FB={auth:m[1].getAuth(app),db:m[2].getFirestore(app),a:m[1],f:m[2]};
    try{ FB.auth.languageCode='es'; }catch(e){}
    return new Promise(function(res){ var un=null, got=false; un=FB.a.onAuthStateChanged(FB.auth,function(u){ fbUser=u; if(got) return; got=true; if(un) un(); else setTimeout(function(){ un&&un(); },0); res(); }); });
  }).then(function(){ return Promise.all([loadSettings(), fbUser?loadMine():null]); })
  .catch(function(e){ console.warn('Firebase no disponible; modo local',e); FB=null; fbUser=null; });
}
/* --- Registro, inicio de sesión y contraseña en la nube --- */
var pendingPw=null;
function cloudRegister(onOk,onErr){
  var mail=String(S.reg.email||'').trim();
  function done(u){ fbUser=u; pendingPw=null; onOk(); }
  if(fbUser && mailKey(fbUser.email)===mailKey(mail)) return done(fbUser);
  if(!pendingPw){ onErr({code:'need-pw'}); return; }
  FB.a.createUserWithEmailAndPassword(FB.auth,mail,pendingPw).then(function(cr){ done(cr.user); }).catch(function(e){
    if(e&&e.code==='auth/email-already-in-use'){
      /* La cuenta ya existe (por ejemplo, el acceso de administrador) pero puede no tener registro de usuario: si la contraseña coincide, se completa el registro. */
      FB.a.signInWithEmailAndPassword(FB.auth,mail,pendingPw).then(function(cr){
        return FB.f.getDoc(userRef(cr.user.uid)).then(function(d){ if(d.exists()){ fbUser=cr.user; pendingPw=null; return loadMine().then(function(){ boot(); }); } done(cr.user); });
      }).catch(function(){ onErr(e); });
      return;
    }
    onErr(e); });
}
function cloudLogin(mail,pw){
  return FB.a.signInWithEmailAndPassword(FB.auth,String(mail).trim(),pw).then(function(cr){ fbUser=cr.user; return loadMine(); });
}
function cloudLogout(){ return FB.a.signOut(FB.auth).catch(function(){}).then(function(){ fbUser=null; S=fresh(); try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }); }
function cloudChangePw(cur,nw){
  return FB.a.reauthenticateWithCredential(fbUser,FB.a.EmailAuthProvider.credential(fbUser.email,cur)).then(function(){ return FB.a.updatePassword(fbUser,nw); });
}
/* --- Administración en la nube --- */
function cloudLoadAll(){
  return FB.f.getDocs(FB.f.collection(FB.db,'users')).then(function(snap){ var all={};
    snap.forEach(function(d){ var s=unpack(d); if(s&&s.reg&&s.reg.email) all[mailKey(s.reg.email)]=s; }); admCache=all; });
}
function cloudAdminOk(){ return cloud() && fbUser && isAdmEmail(fbUser.email) && fbUser.emailVerified; }
function adminLoginCloud(){
  var el=botScreen({phase:'Administración'}); el.classList.add('compact');
  var q=el.querySelector('#q'), hint=el.querySelector('#hint'), ans=el.querySelector('#answer'), next=el.querySelector('#next'), back=el.querySelector('#back'), dots=el.querySelector('#dots');
  el.querySelector('#tap').remove(); dots.innerHTML='<button type="button" class="forgot" id="aNew">Primera vez: crear mi acceso</button>';
  back.textContent='← Volver'; back.disabled=false; back.onclick=leaveAdmin; next.textContent='Ingresar';
  ans.innerHTML='<form class="login" novalidate>'+fld('a-mail','Correo de administrador',fbUser?fbUser.email:'','email','maxlength="80" autocomplete="username" placeholder="tucorreo@ejemplo.com"')+pwFld('a-pw','Contraseña','current-password')+'<p class="err" id="a-err"></p></form>';
  wireEyes(ans);
  var err=ans.querySelector('#a-err');
  ans.querySelector('form').onsubmit=function(e){ e.preventDefault(); next.click(); };
  ans.querySelectorAll('input').forEach(function(i){ i.oninput=function(){ err.textContent=''; }; });
  function vals(){ return {m:ans.querySelector('#a-mail').value.trim(), p:ans.querySelector('#a-pw').value}; }
  function verifyMsg(u){ return FB.a.sendEmailVerification(u).catch(function(){}).then(function(){ err.textContent=''; hint.textContent='Te enviamos un correo a '+u.email+'. Abre el enlace para confirmar que es tuyo y luego vuelve a ingresar aquí.'; }); }
  next.onclick=function(){ var v=vals();
    if(!isAdmEmail(v.m)){ err.textContent='Este correo no tiene permiso de administrador.'; return; }
    next.disabled=true;
    FB.a.signInWithEmailAndPassword(FB.auth,v.m,v.p).then(function(cr){ fbUser=cr.user; return cr.user.reload().then(function(){ return FB.auth.currentUser; }); })
     .then(function(u){ next.disabled=false; if(!u.emailVerified) return verifyMsg(u); return u.getIdToken(true).then(function(){ adminPanel('resumen'); }); })
     .catch(function(e){ next.disabled=false; err.textContent=fbErr(e)+((e.code==='auth/invalid-credential'||e.code==='auth/user-not-found')?' Si es tu primera vez, usa «Primera vez: crear mi acceso».':''); });
  };
  el.querySelector('#aNew').onclick=function(){ var v=vals();
    if(!isAdmEmail(v.m)){ err.textContent='Este correo no tiene permiso de administrador.'; return; }
    var r=regRule('pw')(v.p); if(r){ err.textContent=r; return; }
    FB.a.createUserWithEmailAndPassword(FB.auth,v.m,v.p).then(function(cr){ fbUser=cr.user; return verifyMsg(cr.user); }).catch(function(e){ err.textContent=fbErr(e); });
  };
  typeQA(q,'Acceso de administrador.',hint,'Ingresa con tu correo y tu contraseña de administrador.',function(){ ans.classList.remove('wait'); });
}
function cloudSaveSettings(d,pm,pa){
  var v={trialDays:d,priceM:pm,priceA:pa,updatedAt:Date.now()};
  return FB.f.setDoc(FB.f.doc(FB.db,'settings','app'),v,{merge:true}).then(function(){ var cc=jget(CKEY,{}); cc.trialDays=d; cc.priceM=pm; cc.priceA=pa; jset(CKEY,cc); });
}

/* ================= ARRANQUE ================= */
drawOrbs();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){ if(reduce) drawOrbs(); });
function boot(){
  if(/^#admin/.test(location.hash)||adminMode){ adminEntry(); return; }
  if(cloud() && fbUser && isAdmEmail(fbUser.email) && !(S.reg && S.reg.registeredAt)){ adminEntry(); return; }
  if(/^#login/.test(location.hash)){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
    if(!(S.reg && S.reg.registeredAt && (cloud()||S.reg.pw) && isAuth())){ loginScreen(); return; } }
  if(!cloud() && S.reg && S.reg.registeredAt && S.reg.email && !users()[mailKey(S.reg.email)]) save();
  if(S.stage!=='reg' && S.reg && S.reg.registeredAt){
    if(!cloud() && !S.reg.pw){ createPwScreen(); return; }
    if(!isAuth()){ loginScreen(); return; }
  }
  if(S.stage==='app' && S.route) renderApp('ruta');
  else if((S.stage==='intro'||S.stage==='building') && S.route) routeIntro();
  else if(S.stage==='diag') welcomeDiag();
  else startReg();
}
cloudInit().then(function(){ boot(); });
window.addEventListener('hashchange',function(){ if(/^#admin/.test(location.hash)&&!adminMode){ document.querySelectorAll('.ov').forEach(function(o){o.remove();}); document.body.style.overflow=''; adminEntry(); } });
if(reduce) setInterval(drawOrbs,1000);
})();
</script>
